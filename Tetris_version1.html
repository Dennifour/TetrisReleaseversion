    if(sig===this._chatSig) return;
    this._chatSig=sig;
    if(!log.length){ el.innerHTML='<p class="none">'+esc(T("chat_empty"))+'</p>'; return; }
    const stuck=el.scrollTop+el.clientHeight>=el.scrollHeight-24;
    el.innerHTML=log.map(m=>'<div class="msg'+(m.n===CFG.name?" mine":"")+'">'+
      '<span class="who">'+esc(m.n)+'</span>'+esc(m.m)+'</div>').join("");
    // follow the conversation, unless the reader has scrolled back up it
    if(stuck) el.scrollTop=el.scrollHeight;
  },

  /* One at a time, and the answer is the only way out of it — an invite that
     could be left on screen would be answered after it had gone stale. */
  ask(title,sub,yes,no){
    $("#ask-t").textContent=title;
    $("#ask-s").textContent=sub;
    const close=fn=>()=>{ Sfx.ui(); this.show(this._askBack||"#v-lobby"); afterScreen(()=>fn&&fn()); };
    $("#ask-yes").onclick=close(yes);
    $("#ask-no").onclick=close(no);
    this._askBack=this.cur;
    this.show("#v-ask");
  },
  gotInvite(inv){
    if(Room.on||(G&&!G.over)) return;
    Sfx.ui();
    this.ask(T("inv_t"),T("inv_s",{n:inv.n}),async()=>{
      Who.clearInvite();
      try{ await Net.joinRoom(inv.r); this.showRoom(); }
      catch(e){ this.show("#v-lobby"); this.err("#lob-hint",e.message); }
    },()=>Who.clearInvite());
  },

  setReady(v){
    if(Room.on){ Room.set("rdy",v); const m=Room.me(); if(m) m.rdy=v; this.renderRoom(); return; }
    if(!Net.ready()) return;
    READY_P2P.me=v; Net.send({t:"r",v});
    this.renderRoom();
    if(READY_P2P.me&&READY_P2P.peer) startMatch();
  },
  peerReady(v){
    READY_P2P.peer=v; this.renderRoom();
    if(READY_P2P.me&&READY_P2P.peer) startMatch();
  },
  leaveRoom(){
    clearInterval(this._rooms);
    Net.reset(); READY_P2P.me=READY_P2P.peer=false;
    this.show("#v-menu");
    afterScreen(()=>{ G=null; FOES=[]; render(null); });
  },
  roomGone(){
    if(!Room.on) return;
    Room.stop(); Net.reset();
    if(G && !G.over && G.mode==="versus"){
      G.paused=true;
      this.gameOverCustom(T("ov_dc"),T("ov_dc_s"));
    }else if(G && G.over && G.mode==="versus") this.matchGone(T("ov_roomgone"));
    else if(this.cur==="#v-room"){
      this.show("#v-lobby");
      this.err("#lob-hint",T("e_roomgone"));
    }
  },
  peerLost(){
    Net.reset();
    READY_P2P.me=READY_P2P.peer=false;
    if(G && !G.over && G.mode==="versus"){
      G.paused=true;
      this.gameOverCustom(T("ov_dc"),T("ov_dc_s"));
    }else if(G && G.over && G.mode==="versus") this.matchGone(T("ov_dc_s"));
    else if(this.cur==="#v-room"){
      this.show("#v-lobby");
      this.err("#lob-hint",T("e_peerleft"));
    }
  },
  /* The result card was already up, offering a rematch, when the room went. It
     is written by state rather than by which screen is showing, because the
     card is 700ms behind the death that called for it and the room can go in
     between. There is nothing left to play again, so the button stops saying
     so and leads out instead. */
  matchGone(why){
    $("#o-sub").textContent=why;
    $("#again-l").textContent=T("ov_tolobby");
  },

  /* pause / result */
  /* A match cannot be stopped from inside one well. The clock a room runs on is
     everybody's, and a player who could halt their own is the only one not
     spending it — safe from the stack, from the garbage on its way, and from
     the countdown, while three other people wait. So the card still opens,
     because it is the way out of a run and the only one, but in a match it
     opens over a well that is still falling. The line under the title has
     always said as much; now it is true. */
  togglePause(){
    if(!G) return;
    if(G.over) return;
    const halts = G.mode!=="versus";
    // Nothing to toggle against when the run never stopped: the card itself says.
    const open = halts ? G.paused : this.cur==="#v-pause";
    if(open){ G.paused=false; this.closeAll(); Input.reset(); return; }
    if(halts) G.paused=true;
    Input.reset();
    $("#p-sub").textContent = T(halts ? "pause_sub" : "pause_sub_vs");
    /* Nothing to restart in a match either: the round is the room's, and a
       fresh well here would be one player quietly playing a different game. */
    $("#b-restart").hidden = !halts;
    this.show("#v-pause");
  },

  /* The well has stopped but a score match is not over until every other one
     has too, so the card goes up on what is known and the tally writes over
     it. Nothing is recorded until then — the win is not ours to claim yet. */
  matchPending(){
    this.gameOverCustom(T(G.timeout?"ov_time":"ov_top"),T("ov_tally"));
  },
  tallied(won,tie,best){
    noteRun(G,won,((G.endedAt||now())-G.startedAt)/1000);
    if(Net.mode==="room"){ if(won&&Room.on) Room.set("w",(Room.me()||{w:0}).w+1); }
    else if(won) WINS_P2P.me++;
    else if(!tie) WINS_P2P.peer++;
    this.renderRoom();
    const n=G.score.toLocaleString();
    $("#o-title").textContent = tie?T("ov_draw"):won?T("ov_win"):T("ov_lose");
    $("#o-sub").textContent   = tie?T("ov_draw_s",{n})
                              : won?T("ov_score_win_s",{n})
                              : T("ov_score_lose_s",{n,b:Math.max(0,best).toLocaleString()});
    if(won) Sfx.win();
  },

  gameOver(won){
    const solo = G.mode!=="versus";
    if(!solo){
      if(Net.mode!=="room"){ if(won) WINS_P2P.me++; else WINS_P2P.peer++; }
      this.renderRoom();
    }
    noteRun(G,won,((G.endedAt||now())-G.startedAt)/1000);
    const peer = Net.peerName||T("your_opponent");
    // A room is up to four, so its result names the round, not an opponent.
    const many = Net.mode==="room";
    let title, sub;
    if(G.mode==="sprint" && won){ title=T("ov_sprint"); sub=T("ov_sprint_s"); }
    else if(G.mode==="speed" && G.timeout){ title=T("ov_speed"); sub=T("ov_speed_s",{n:G.lines}); }
    else if(!solo && won){ title=T("ov_win"); sub=many?T("ov_win_s_room"):T("ov_win_s",{n:peer}); }
    else if(!solo){ title=T("ov_lose");
                    sub=G.away?T("ov_lose_away"):many?T("ov_lose_s_room"):T("ov_lose_s",{n:peer}); }
    else { title=T("ov_top"); sub=T("ov_top_s"); }
    this.gameOverCustom(title,sub);
  },
  gameOverCustom(title,sub){
    $("#o-title").textContent=title;
    $("#o-sub").textContent=sub;
    const el=((G.endedAt||now())-G.startedAt)/1000;
    const rows=[
      [T("r_time"), el.toFixed(2)+"s"],
      [T("r_score"), G.score.toLocaleString()],
      [T("r_lines"), G.lines],
      [T("r_pps"), (G.pieceCount/Math.max(0.001,el)).toFixed(2)],
      [T("r_quads"), G.stats.quad],
      [T("r_tspins"), G.stats.tspin],
      [T("r_combo"), G.stats.maxCombo]
    ];
    if(G.mode==="versus" && G.attacks){ rows.push([T("r_sent"),G.attackSent],[T("r_taken"),G.attackRecv]); }
    $("#o-stats").innerHTML = rows.map(([k,v])=>
      `<div class="sp"><span>${esc(k)}</span><b>${esc(String(v))}</b></div>`).join("");

    $("#again-l").textContent = G.mode==="versus"
      ? T(Net.ready() ? "rematch" : "ov_tolobby")
      : T("again");
    setTimeout(()=>this.show("#v-over"),700);
  },

  err(sel,msg,stay){ this.flash(sel,msg,"#ff7b8a",stay); },
  ok(sel,msg){ this.flash(sel,msg,"#4fe0a8"); },
  /* Notes clear themselves; a handshake failure stays, as the only record. */
  flash(sel,msg,color,stay){
    const el=$(sel); if(!el) return;
    if(el.dataset.orig===undefined) el.dataset.orig=el.innerHTML;
    el.innerHTML='<b style="color:'+color+'">'+esc(msg)+'</b>';
    clearTimeout(this["_t"+sel]);
    if(stay) return;
    this["_t"+sel]=setTimeout(()=>{ if(el.dataset.orig!==undefined) el.innerHTML=el.dataset.orig; },5000);
  }
};

/* TETRIS drawn on the board's own grid: every letter is one stroke a cell
   thick, run along cell centres and cut flat at the ends, set tight. The R's
   leg is drawn past the baseline and cut off by the viewport, so it finishes
   square on the line like every other stem. Solid
   letterforms rather than a mosaic — the grid sets the proportions, it does
   not tile them. Our own lettering, not the Tetris Company's mark. */
const GLYPHS = {
  T:"M0 .5H3M1.5 .5V5",
  E:"M.5 0V5M.5 .5H3M.5 2.5H2.6M.5 4.5H3",
  R:"M.5 0V5M.5 .5H2.5V2.5H.5M1.35 2.5 2.75 5.35",
  I:"M0 .5H3M1.5 .5V4.5M0 4.5H3",
  S:"M3 .5H.5V2.5H2.5V4.5H0"
};
const GLYPH_W=3, GLYPH_H=5, GLYPH_GAP=0.7;
function paintLogo(){
  const el=$("#logo");
  if(!el) return;
  const word=[..."TETRIS"];
  const cols=word.length*GLYPH_W+(word.length-1)*GLYPH_GAP;
  const paths=word.map((c,i)=>
    '<path d="'+GLYPHS[c]+'" transform="translate('+(i*(GLYPH_W+GLYPH_GAP)).toFixed(2)+' 0)"/>').join("");
  el.innerHTML='<svg viewBox="-.03 -.03 '+(cols+0.06).toFixed(2)+' '+(GLYPH_H+0.06)+'" aria-hidden="true" '+
    'focusable="false" fill="none" stroke="currentColor" stroke-width="1">'+paths+'</svg>';
}

/* <details> puts its block on screen the instant it opens, with no height to
   travel through, so the move is run here: measure where the block wants to
   end up, drive it from nothing to that, then hand the height back so it can
   reflow on its own again. Closing is the same in reverse, which means
   holding the element open until the block has finished leaving. */
const REDUCED = matchMedia("(prefers-reduced-motion:reduce)");
const FOLD_MS = 300;
const FOLDS = $$(".fold").map(d=>{
  const body=d.querySelector(".foldbody");
  /* Whatever move was in flight is dropped before a new one starts, so a
     block turned round part-way cannot have its old finish fire later and
     clear the height out from under the new one. */
  const stop=()=>{
    clearTimeout(d._ft);
    if(d._end){ body.removeEventListener("transitionend",d._end); d._end=null; }
  };
  const settle=()=>{ stop(); body.style.height=""; d._busy=false; };
  /* Only the height of the block itself: a slider or a preview inside it
     finishing its own transition is not this move ending. */
  const onEnd=fn=>{
    stop();
    d._end=e=>{ if(e.target===body && e.propertyName==="height") fn(); };
    body.addEventListener("transitionend",d._end);
    d._ft=setTimeout(fn,FOLD_MS+120);
  };
  const open=()=>{
    d.open=true;
    // the preview can only take its measure once the block is in flow
    if(d.id==="fold-touch") renderPreview();
    if(REDUCED.matches){ settle(); return; }
    d._busy=true;
    const h=body.scrollHeight;
    body.style.height="0px";
    requestAnimationFrame(()=>{ body.style.height=h+"px"; });
    onEnd(settle);
  };
  const close=()=>{
    if(!d.open) return;
    if(REDUCED.matches){ d.open=false; settle(); return; }
    d._busy=true;
    // measured, not scrollHeight: a block caught mid-move closes from where
    // it actually is rather than jumping to its full height first
    body.style.height=body.getBoundingClientRect().height+"px";
    requestAnimationFrame(()=>{ body.style.height="0px"; });
    onEnd(()=>{ d.open=false; settle(); });
  };
  return {el:d, open, close};
});
FOLDS.forEach(f=>{
  f.el.querySelector("summary").addEventListener("click",e=>{
    e.preventDefault();                    // the open is ours to run, not the browser's
    Sfx.ui();
    if(f.el._busy) return;
    if(f.el.open){ f.close(); return; }
    /* One block at a time. Three of them open is the wall the folding was for
       in the first place, so opening one puts the others away. */
    FOLDS.forEach(o=>{ if(o!==f) o.close(); });
    f.open();
  });
});

/* 9 · LAYOUT — screen and pads solved together, published as CSS variables */
/* Pure geometry: viewport, size multiplier and the two nudges in; screen,
   control, pad and gutter out. Shared with the settings preview. */
function solve(W,H,scale,btnY,btnX,noPads){
  if(noPads){                            // gestures: the screen is the whole stage
    const gap=Math.round(clamp(Math.min(W,H)*0.028,6,16));
    let SW=W, SH=H, a=SW/SH;
    if(a>1.9) SW=SH*1.9; else if(a<0.40) SH=SW/0.40;
    return {SW:Math.floor(SW),SH:Math.floor(SH),ctl:0,pad:0,gap,land:W>H*1.05,lift:0,inset:0,colH:0};
  }
  const gap=Math.round(clamp(Math.min(W,H)*0.028,6,16));
  const colH=c=>c*1.06;
  const land=W>H*1.05;
  const up=Math.max(0,clamp(btnY||0,-100,100)/100);   // only "raise" costs height
  const inw=Math.max(0,-clamp(btnX||0,-100,100)/100); // only "inward" costs width
  let SW,SH,ctl,pad,lift=0,inset=0;

  if(land){
    const want=Math.min(232*scale,H/1.06);
    const natural=(W-Math.min(H*1.5,W*0.6)-gap*2)/2;
    pad=Math.min(Math.max(want,natural),300*scale,Math.max(56,(W-H*0.45-gap*2)/2));
    pad=Math.max(pad,56);
    SW=W-pad*2-gap*2;
    SH=H;
    ctl=Math.min(pad,want,H/1.06);
  }else{
    const col=(W-gap)/2;
    ctl=Math.min(col*Math.min(1,scale),240*scale,H*0.30*scale);
    SW=W;
    SH=H-gap-colH(ctl);
    const minH=H*0.45;
    if(SH<minH){
      SH=minH;
      ctl=Math.max(50,Math.min(ctl,(H-SH-gap)/1.06));
      SH=H-gap-colH(ctl);
    }
    pad=col;
  }

  SW=Math.max(120,SW); SH=Math.max(120,SH);
  const band=()=>{
    const a=SW/SH;
    if(a>1.9) SW=SH*1.9;
    else if(a<0.40) SH=SW/0.40;
  };
  band();

  // Portrait: raising the pads costs screen height, to a playable floor.
  if(!land){
    lift=Math.round(Math.min(Math.max(0,SH-Math.max(150,H*0.34)),H*0.24)*up);
    SH-=lift;
    band();
  }

  // Landscape: drawing them inward costs screen width; the centred grid then
    // carries both pads in with it.
  if(land){
    inset=Math.round(Math.min(Math.max(0,(SW-Math.max(180,H*0.42))/2),W*0.14)*inw);
    SW-=inset*2;
    band();
  }

  SW=Math.floor(SW); SH=Math.floor(SH);
  ctl=Math.max(50,Math.floor(ctl));
  pad=Math.max(ctl,Math.floor(pad));
  return {SW,SH,ctl,pad,gap,land,lift,inset,colH:colH(ctl)};
}

/* How far the pads may be nudged, clamped to free space so nothing overlaps. */
function offsets(W,H,r){
  const ty=clamp(CFG.btnY,-100,100)/100, tx=clamp(CFG.btnX,-100,100)/100;
  let padsY=0, screenY=0;
  if(r.land){
    padsY=Math.max(0,(H-r.colH)/2)*-ty;
  }else{
    const free=Math.max(0,H-(r.SH+r.gap+r.colH))/2;
    padsY   = ty>=0 ? -r.lift/2 : free*-ty;
    screenY = ty>=0 ? -r.lift/2 : free*-ty;
  }
  const padsX=Math.max(0,(r.pad-r.ctl)/2)*tx;
  return {padsX,padsY,screenY};
}

function viewportBox(){
  const cs=getComputedStyle(STAGE), v=s=>parseFloat(s)||0;
  const vv=window.visualViewport;
  return {
    W:Math.max(180,Math.min(STAGE.clientWidth , vv?vv.width :Infinity)-(v(cs.paddingLeft)+v(cs.paddingRight))),
    H:Math.max(180,Math.min(STAGE.clientHeight, vv?vv.height:Infinity)-(v(cs.paddingTop)+v(cs.paddingBottom)))
  };
}

/* Miniature of the stage: the same solve as the real layout, scaled down. */
function renderPreview(){
  const box=$("#pv"), st=$("#pvstage");
  if(!box||!st) return;
  const bw=box.clientWidth-24;
  if(bw<=0) return;
  const {W,H}=viewportBox();
  const r=solve(W,H,CFG.btnScale,CFG.btnY,CFG.btnX,CFG.touch!=="dpad");
  const o=offsets(W,H,r);
  const SW=r.SW*CFG.boardScale, SH=r.SH*CFG.boardScale;
  const k=Math.min(bw/W,134/H);
  st.style.width =(W*k)+"px";
  st.style.height=(H*k)+"px";
  st.style.setProperty("--gap",(r.gap*k)+"px");
  st.style.setProperty("--screen-w",(SW*k)+"px");
  st.style.setProperty("--screen-h",(SH*k)+"px");
  const wl=wellBox(SW,SH), pvw=$("#pvstage").querySelector(".pv-s i");
  if(pvw){
    pvw.style.left  =(wl.x/SW*100)+"%";
    pvw.style.top   =(wl.y/SH*100)+"%";
    pvw.style.width =(wl.w/SW*100)+"%";
    pvw.style.height=(wl.h/SH*100)+"%";
  }
  st.style.setProperty("--ctl",(r.ctl*k)+"px");
  st.style.setProperty("--pad",(r.pad*k)+"px");
  st.style.setProperty("--shift-x",(o.padsX*k)+"px");
  st.style.setProperty("--shift-y",(o.padsY*k)+"px");
  st.style.setProperty("--screen-y",(o.screenY*k)+"px");
  st.className="pvstage "+(r.land?"land":"port")+(CFG.swap?" swap":"");
}

function layout(){
  const {W,H}=viewportBox();
  const r=solve(W,H,CFG.btnScale,CFG.btnY,CFG.btnX,CFG.touch!=="dpad");
  const o=offsets(W,H,r);
  /* The panel solve() would give the well, hold and next shrinks by this
     fraction — scaled after the fact, not threaded through solve(), so the
     control pads it also sizes stay exactly where they were. The grid centres
     the smaller box on its own; nothing else has to know it shrank. */
  STAGE.style.setProperty("--gap",r.gap+"px");
  STAGE.style.setProperty("--screen-w",(r.SW*CFG.boardScale)+"px");
  STAGE.style.setProperty("--screen-h",(r.SH*CFG.boardScale)+"px");
  STAGE.style.setProperty("--ctl",r.ctl+"px");
  STAGE.style.setProperty("--pad",r.pad+"px");
  STAGE.style.setProperty("--shift-x",o.padsX+"px");
  STAGE.style.setProperty("--shift-y",o.padsY+"px");
  STAGE.style.setProperty("--screen-y",o.screenY+"px");
  document.body.classList.toggle("land",r.land);
  document.body.classList.toggle("port",!r.land);
  resizeCanvas();
  renderPreview();
}

addEventListener("resize",layout);
addEventListener("orientationchange",()=>{ layout(); setTimeout(layout,180); });
if(window.visualViewport) visualViewport.addEventListener("resize",layout);

$("#pausebtn").addEventListener("click",e=>{ e.preventDefault(); e.stopPropagation(); UI.togglePause(); });
$("#pausebtn").addEventListener("pointerdown",e=>e.stopPropagation());

/* fullscreen — hidden on iPhone Safari, which has no element fullscreen */
const FSBTN=$("#fsbtn");
const fsEl =()=>document.fullscreenElement||document.webkitFullscreenElement||null;
const fsCan=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);

if(!fsCan){ FSBTN.classList.add("gone"); }
else{
  FSBTN.addEventListener("click",e=>{
    e.preventDefault(); e.stopPropagation();
    Sfx.ui();
    const d=document, el=d.documentElement;
    try{
      if(fsEl()) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
      else       (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }catch(_){}
  });
  FSBTN.addEventListener("pointerdown",e=>e.stopPropagation());
  const syncFs=()=>{
    FSBTN.classList.toggle("on",!!fsEl());
    layout();
    setTimeout(layout,120);
  };
  document.addEventListener("fullscreenchange",syncFs);
  document.addEventListener("webkitfullscreenchange",syncFs);
}

/* boot — the saved touch scheme has to reach the body, not just the settings
   screen: it is what hides the pads and draws the swipe pause button. It also
   lays out. */
applyLang();
applyTouchMode();
applyTheme();
resizeCanvas();
UI.netStatus();
render(null);
/* Solo can wait for its player. A match cannot: the room has three other
   people in it, and the tab that just went away is about to stop running. */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden || !G || G.over) return;
  if(G.mode==="versus") dropOut();
  else if(!G.paused) UI.togglePause();
});
// The seat and the presence record are both given up here, keepalive so they go.
addEventListener("beforeunload",()=>{ try{ Net.reset(); Who.stop(); }catch(e){} });

</script>
</body>
