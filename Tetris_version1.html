<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TETRIS</title>
<style>
:root{
  --bg:#0a0a0c;
  --surface:#111113;
  --surface-2:#171719;
  --line:rgba(255,255,255,.14);
  --line-strong:rgba(255,255,255,.26);
  --fg:#ededf0;
  --fg-dim:#c4c4cc;
  --fg-faint:#9a9aa5;
  --accent:#ededf0;
  --danger:#e5484d;
  --radius:4px;
}
/* Light mode swaps every token above; nothing downstream reads a raw
   colour, so this is the only place "light" is ever spelled out. */
:root[data-ui-theme="light"]{
  --bg:#ffffff;
  --surface:#f6f6f7;
  --surface-2:#eeeef0;
  --line:rgba(0,0,0,.11);
  --line-strong:rgba(0,0,0,.22);
  --fg:#0b0b0d;
  --fg-dim:#55555d;
  --fg-faint:#83838b;
  --accent:#0b0b0d;
  --danger:#c8272f;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  font-size:15px;
  user-select:none;-webkit-user-select:none;
  /* Its own stacking context, with no other side effect, so #bg's negative
     z-index is weighed against this box's background rather than the root's —
     without it, body's own colour paints in normal flow, after a negative
     z-index layer, and covers it outright. */
  isolation:isolate;
}

/* The board and its controls own every touch that lands on them; a screen
   over the top takes its own (it has to be able to scroll). */
#stage{
  position:relative;height:100%;width:100%;touch-action:none;
  --gap:12px; --screen-w:300px; --screen-h:300px; --ctl:148px; --pad:168px;
  display:grid;align-items:center;justify-items:center;align-content:center;justify-content:center;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  gap:var(--gap);
}

/* The board fades with the run it belongs to: in when one starts, out once
   there's no run left. */
#screen{
  position:relative;width:var(--screen-w);height:var(--screen-h);overflow:hidden;
  opacity:0;transition:opacity .3s ease;
}
#screen.live{opacity:1;transition:opacity .34s ease .1s}
#screen canvas{display:block;width:100%;height:100%}

/* The well is opaque and draws over whatever is behind it, so a custom
   background only ever shows in the margins around the board and the pads —
   a backdrop, not something the run has to know about. It rides the same
   class the board's own fade does. */
#bg{
  position:fixed;inset:0;z-index:-1;
  background-size:cover;background-position:center;
  opacity:0;transition:opacity .3s ease;
}
body.playing #bg{opacity:var(--bg-bright,.45)}

/* The corner icons share one row, so each one's place comes from the layout
   rather than from arithmetic that has to re-derive its neighbour's width. */
.topbtns{
  position:fixed;z-index:14;
  top:max(5px,env(safe-area-inset-top));
  right:max(5px,env(safe-area-inset-right));
  display:flex;align-items:center;gap:9px;
}
.fsbtn{
  width:clamp(20px,3.6vmin,26px);height:clamp(20px,3.6vmin,26px);
  padding:0;border:0;background:none;cursor:pointer;
  color:var(--fg-faint);
  display:grid;place-items:center;
  transition:color .1s;
}
.fsbtn:hover,.fsbtn:focus-visible{color:var(--fg);outline:none}
.fsbtn:active{color:var(--fg)}
.fsbtn svg{width:100%;height:100%;display:block}
.fsbtn path{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.fsbtn .i-shrink{display:none}
.fsbtn.on .i-expand{display:none}
.fsbtn.on .i-shrink{display:block}
.fsbtn.gone{display:none}
/* Swipe leaves no PAUSE button on the pads, so one sits to the left of the
   fullscreen icon — only while a game is actually on screen. It comes first in
   the row, so it keeps that side whatever the icons measure, and slides into
   the corner by itself where fullscreen is unavailable. */
.pausebtn{display:none}
body.swipe.playing .pausebtn,body.notouch.playing .pausebtn{display:grid}

body.land #stage{grid-template-columns:var(--pad) var(--screen-w) var(--pad);grid-template-areas:"dpad screen actions"}
body.land.swap #stage{grid-template-areas:"actions screen dpad"}
body.port #stage{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;grid-template-areas:"screen screen" "dpad actions"}
body.port.swap #stage{grid-template-areas:"screen screen" "actions dpad"}
#screen{grid-area:screen;transform:translateY(var(--screen-y,0px))}
#dpad-wrap{grid-area:dpad;transform:translate(calc(var(--shift-x,0px) * -1),var(--shift-y,0px))}
#act-wrap{grid-area:actions;transform:translate(var(--shift-x,0px),var(--shift-y,0px))}
#dpad-wrap,#act-wrap{opacity:0;visibility:hidden;transition:opacity .17s ease,visibility 0s .17s}
body.swipe #dpad-wrap,body.swipe #act-wrap,
body.notouch #dpad-wrap,body.notouch #act-wrap{display:none}
body.playing #dpad-wrap,body.playing #act-wrap{opacity:1;visibility:visible;transition:opacity .26s ease .25s}
body.swap #dpad-wrap{transform:translate(var(--shift-x,0px),var(--shift-y,0px))}
body.swap #act-wrap{transform:translate(calc(var(--shift-x,0px) * -1),var(--shift-y,0px))}

/* --- controls --- */
.pad{display:flex;flex-direction:column;align-items:center;gap:calc(var(--gap)*.85);width:100%;min-width:0}

.dpad{position:relative;width:var(--ctl);height:var(--ctl);flex:0 0 auto}
.dcross{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dcross path{fill:none;stroke:var(--fg-dim);stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.dpad b{position:absolute;display:grid;place-items:center;background:none;border:0;border-radius:0;color:var(--fg-dim);transition:color .08s,transform .08s}
.dpad b svg{width:54%;height:54%;display:block}
.dpad b svg path{fill:none;stroke:currentColor;stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .08s}
.dpad b.l svg{transform:rotate(-90deg)}
.dpad b.r svg{transform:rotate(90deg)}
.dpad b.d svg{transform:rotate(180deg)}
.dpad b.u{left:34%;top:0;width:32%;height:34%}
.dpad b.d{left:34%;bottom:0;width:32%;height:34%}
.dpad b.l{top:34%;left:0;height:32%;width:34%}
.dpad b.r{top:34%;right:0;height:32%;width:34%}

.abtn{
  width:calc(var(--ctl)*.44);height:calc(var(--ctl)*.44);border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;text-align:center;line-height:1.15;
  font-weight:600;letter-spacing:.05em;font-size:max(10px,calc(var(--ctl)*.115));
  color:var(--fg-dim);
  background:none;
  border:1.8px solid var(--fg-dim);
  transition:background .08s,border-color .08s,color .08s,transform .08s;
}
.abtn.sm{width:calc(var(--ctl)*.44);height:calc(var(--ctl)*.21);border-radius:var(--radius);font-size:max(9px,calc(var(--ctl)*.082))}

.actgrid{
  display:grid;
  grid-template-columns:calc(var(--ctl)*.44) calc(var(--ctl)*.44);
  grid-template-areas:". hold" "b a" ". pause";
  gap:calc(var(--ctl)*.1);
  justify-content:center;align-items:center;
}
.actgrid .gh{grid-area:hold}
.actgrid .gb{grid-area:b}
.actgrid .ga{grid-area:a}
.actgrid .gp{grid-area:pause}
.dpad b.hit{color:var(--fg);transform:scale(.92)}
.dpad b.hit svg path{fill:currentColor}
.abtn.hit{background:var(--fg);border-color:var(--fg);color:var(--bg);transform:scale(.95)}

</style>
</head>
<body>

<div class="topbtns">
  <button id="pausebtn" class="fsbtn pausebtn" type="button" data-i18n-aria="btn_pause">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 5v14M14.5 5v14"/></svg>
  </button>
  <button id="fsbtn" class="fsbtn" type="button" data-i18n-aria="btn_full">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <g class="i-expand"><path d="M9 3H5.5A2.5 2.5 0 0 0 3 5.5V9M15 3h3.5A2.5 2.5 0 0 1 21 5.5V9M9 21H5.5A2.5 2.5 0 0 1 3 18.5V15M15 21h3.5a2.5 2.5 0 0 0 2.5-2.5V15"/></g>
      <g class="i-shrink"><path d="M3 9h3.5A2.5 2.5 0 0 0 9 6.5V3M21 9h-3.5A2.5 2.5 0 0 1 15 6.5V3M3 15h3.5A2.5 2.5 0 0 1 9 17.5V21M21 15h-3.5a2.5 2.5 0 0 0-2.5 2.5V21"/></g>
    </svg>
  </button>
</div>

<div id="bg"></div>
<div id="stage">
  <div id="screen"><canvas id="cv"></canvas></div>

  <div id="dpad-wrap" class="pad">
    <div class="dpad">
      <svg class="dcross" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <path d="M34 1H66V34H99V66H66V99H34V66H1V34H34Z"/>
      </svg>
      <b class="u" data-k="hardDrop"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 7 19 17H5Z"/></svg></b>
      <b class="l" data-k="left"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 7 19 17H5Z"/></svg></b>
      <b class="r" data-k="right"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 7 19 17H5Z"/></svg></b>
      <b class="d" data-k="softDrop"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 7 19 17H5Z"/></svg></b>
    </div>
  </div>

  <div id="act-wrap" class="pad">
    <div class="actgrid">
      <div class="abtn sm gh" data-k="hold" data-i18n="btn_hold"></div>
      <div class="abtn b gb" data-k="rotL">B</div>
      <div class="abtn a ga" data-k="rotR">A</div>
      <div class="abtn sm gp" data-k="pause" data-i18n="btn_pause"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* 0 · SMALL UTILITIES */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const STAGE = $("#stage");
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const now = () => performance.now();
const rnd = n => Math.floor(Math.random()*n);

/* A phone, rather than a laptop with a touchscreen: a touch laptop still
   reports a fine pointer and real hover, so it keeps the pads off and the
   button to turn them back on. */
const isCoarse = () => matchMedia("(pointer:coarse)").matches && matchMedia("(hover:none)").matches;

const store = {
  get(k,d){ try{ const v=localStorage.getItem("tfx:"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("tfx:"+k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("tfx:"+k); }catch(e){} }
};
["turnUrl","turnUser","turnPass","fbUse"].forEach(k=>store.del(k));

/* Bundles the whole look (and eventually sound) of a run into one pick:
   background image, canvas font, piece skin, line-clear effect, board
   outline colour, HUD text colour, and sound pack. Selecting a theme is the
   only way any of these change now — there is no per-element override
   beside it. `skin`, `lineClearFx` and `soundFx` are carried on every theme
   and read into THEME below, but nothing branches on them yet: there is
   only one implementation of each so far, and a switch with a single case
   would be exactly the abstraction this codebase's own conventions warn
   against. They are where the next theme's alternate hooks in. */
const THEMES = [
  { id:"default", background:null,
    font:"ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif",
    skin:"nes", lineClearFx:"dissolve", boardColor:"#ffffff",
    textColor:"#ededf0", soundFx:"default" },
];

const CFG = {
  das:   store.get("das",170),
  arr:   store.get("arr",60),
  sdf:   store.get("sdf",8),
  snd:   store.get("snd",true),
  vol:   store.get("vol",100),      // % of the mix the master gain carries
  // was "shake", when the board jittered instead of giving
  bob:   store.get("bob", store.get("shake",true)),
  ghost: store.get("ghost",true),
  grid:  store.get("grid",false),       // the well's cell grid
  theme: store.get("theme","default"),
  uiTheme: store.get("uiTheme","dark"),   // light | dark | system — page chrome, not the board's own THEME
  bgBright: store.get("bgBright",45),   // % opacity the active theme's background shows at
  swap:  store.get("swap",false),
  btnScale: store.get("btnScale",1),
  boardScale: store.get("boardScale",0.7),   // the well+hold+next panel, as a fraction of what solve() would otherwise give it
  btnY:  store.get("btnY",0),
  btnX:  store.get("btnX",0),
  fbUrl: store.get("fbUrl",""),         // Firebase Realtime Database, for online play
  touch: store.get("touch", isCoarse()?"swipe":"off"),  // dpad | swipe | off
  touchSet: store.get("touchSet",false),   // the player picked one, rather than being handed the default
  swMove: store.get("swMove",80),       // % of a cell to drag for one step sideways
  swDrop: store.get("swDrop",70),       // % of a cell to drag for one row down
  swFlick:store.get("swFlick",110),     // flick speed, in hundredths of a px per ms
  keys:  store.get("keys",null),        // filled from KEYS_DEFAULT below
  pads:  store.get("pads",null),        // filled from PADS_DEFAULT below
  padOn: store.get("padOn",true),
  speedDiff: store.get("speedDiff","normal"),   // easy | normal | hard
  lang:  store.get("lang", /^ko/i.test(navigator.language||"") ? "ko" : "en"),
  name:  store.get("name","") || ("PLAYER"+rnd(900+100))
};
store.del("shake");                 // read once into `bob` above, then done with
["round","fx"].forEach(k=>store.del(k));   // the corner switch and the drop trail are gone
store.del("clearfx");               // the line-clear effects it picked between are gone
store.del("skin");                  // folded into the theme it was one field of
store.del("bg");                    // themes ship their own background now, not an upload
/* An install holding a theme id that no longer exists — one from before a
   theme was retired, or a stray value — is pointed at the first theme
   rather than left holding a value nothing here defines. */
if(!THEMES.some(t=>t.id===CFG.theme)) CFG.theme=THEMES[0].id;
const saveCfg = () => { for(const k in CFG) store.set(k,CFG[k]); };

/* The resolved active theme — re-picked whenever CFG.theme changes, read by
   everything below rather than each call site searching THEMES itself. */
let THEME = THEMES.find(t=>t.id===CFG.theme) || THEMES[0];
let CANVAS_FONT = THEME.font;
function applyTheme(){
  THEME = THEMES.find(t=>t.id===CFG.theme) || THEMES[0];
  CANVAS_FONT = THEME.font;
  INK.frame = THEME.boardColor;
  INK.fg = THEME.textColor;
  INK.dim = rgba(THEME.textColor,.82);
  INK.faint = rgba(THEME.textColor,.65);
  applyBg();
}
function applyBg(){
  $("#bg").style.backgroundImage = THEME.background ? "url("+THEME.background+")" : "none";
  document.documentElement.style.setProperty("--bg-bright", CFG.bgBright/100);
}

/* The page's own light/dark, independent of the board's THEME above — kept
   working even with nothing on screen to switch it from yet. "system" is
   resolved against the OS preference and kept in sync with it. */
const PREFERS_LIGHT = matchMedia("(prefers-color-scheme: light)");
function applyUiTheme(){
  const resolved = CFG.uiTheme==="system" ? (PREFERS_LIGHT.matches?"light":"dark") : CFG.uiTheme;
  document.documentElement.setAttribute("data-ui-theme",resolved);
  const mc=$('meta[name="theme-color"]');
  if(mc) mc.content = resolved==="light" ? "#ffffff" : "#05060f";
}
PREFERS_LIGHT.addEventListener("change",()=>{ if(CFG.uiTheme==="system") applyUiTheme(); });
applyUiTheme();

/* Personal bests, kept on this device only. Marathon counts every run, since
   topping out is how it ends; sprint only counts a finished 40. */
const REC = {
  marathon: store.get("recMarathon",0),   // points
  sprint:   store.get("recSprint",0),     // seconds, 0 = never finished
  wins:     store.get("recWins",0),       // versus wins, lifetime
  // lines survived, one best per difficulty: they are three different games
  speed:    Object.assign({easy:0,normal:0,hard:0}, store.get("recSpeed",null)||{})
};
const saveRec = () => {
  store.set("recMarathon",REC.marathon); store.set("recSprint",REC.sprint);
  store.set("recWins",REC.wins); store.set("recSpeed",REC.speed);
};
/* Handed the run itself: what counts as a best differs by mode, and every mode
   measures it off something else the game already holds. */
function noteRun(g,won,secs){
  let beat=false;
  if(g.mode==="solo" && g.score>REC.marathon){ REC.marathon=g.score; beat=true; }
  if(g.mode==="sprint" && won && (REC.sprint===0 || secs<REC.sprint)){ REC.sprint=secs; beat=true; }
  if(g.mode==="speed" && g.lines>REC.speed[g.diff]){ REC.speed[g.diff]=g.lines; beat=true; }
  if(g.mode==="versus" && won){ REC.wins++; beat=true; }
  if(beat) saveRec();
  return beat;
}

/* Stored keyboard-era handling defaults move to the touch ones. */
(function migrateHandling(){
  const OLD={das:133,arr:18,sdf:25}, NEW={das:170,arr:60,sdf:8};
  if(store.get("handlingRev",0)>=2) return;
  for(const k in NEW) if(CFG[k]===OLD[k]) CFG[k]=NEW[k];
  store.set("handlingRev",2);
  saveCfg();
})();

/* The pads used to come up everywhere, including on a desktop with no touch
   screen to press them with, and mobile's default was the on-screen pad
   rather than swipe. A mode the player picked is left alone -- but saveCfg()
   writes every key, so an install from before `touchSet` had the default
   flushed to storage and reads the same either way as a real choice. Those
   are moved on their value, which is the best the stored data can say. Gated
   per revision rather than one shared cutoff, since a device is coarse or it
   isn't and a given visitor can only ever match one of the two corrections
   below -- bumping the number is enough to let a visitor already moved by
   the first still receive the second. */
(function migrateTouchOff(){
  if(store.get("touchRev",0)>=2) return;
  if(CFG.touch==="dpad" && !CFG.touchSet && !isCoarse()) CFG.touch="off";
  if(CFG.touch==="dpad" && !CFG.touchSet && isCoarse()) CFG.touch="swipe";
  store.set("touchRev",2);
  saveCfg();
})();

/* 0b · LANGUAGE — data-i18n keys, one table per string */
const LANGS = ["en","ko"];
const I18N = {
  b_sendto:["{n} TO {who}","{who}에게 {n}줄"],
  e_badcode:["That code isn't valid. Copy the whole thing and try again.","올바른 코드가 아닙니다. 코드 전체를 복사해 다시 시도하세요."],
  e_nothost:["That's not a host code. Ask for the code from STEP 1.","방장 코드가 아닙니다. 상대의 1단계 코드를 받으세요."],
  e_notguest:["That's not a guest code. It should come from their STEP 2.","참가자 코드가 아닙니다. 상대의 2단계 코드여야 합니다."],
  e_first:["Create your code first.","먼저 코드를 만드세요."],
  e_nofb:["No signaling database set. Add a Firebase database URL under Settings → Online, or play P2P and swap codes by hand.","시그널링 데이터베이스가 설정되지 않았습니다. 설정 → 온라인에서 Firebase 주소를 입력하거나 P2P로 코드를 직접 주고받으세요."],
  e_fbnet:["Could not reach the signaling database. Check the URL and your connection.","시그널링 데이터베이스에 연결하지 못했습니다. 주소와 네트워크를 확인하세요."],
  e_fbauth:["The signaling database refused the write. Check its security rules.","시그널링 데이터베이스가 쓰기를 거부했습니다. 보안 규칙을 확인하세요."],
  e_noroom:["No room with that code. Check it and try again.","그 코드의 방이 없습니다. 다시 확인해 주세요."],
  e_roomfull:["Someone already joined that room.","이미 다른 사람이 참가한 방입니다."],
  /* A room holds up to four, so the result names the round rather than a
     player nobody agreed was "the" opponent. */
  opponent:["OPPONENT","상대"],
  btn_pause:["PAUSE","정지"],
  btn_hold:["HOLD","홀드"],
  btn_full:["Fullscreen","전체화면"],
  g_hold:["HOLD","홀드"],
  g_next:["NEXT","다음"],
  g_go:["GO","시작"],
  g_score:["SCORE","점수"],
  g_lines:["LINES","줄"],
  g_level:["LEVEL","레벨"],
  g_left:["LINES LEFT","남은 줄"],
  g_sent:["SENT","보냄"],
  g_paused:["PAUSED","일시정지"],
  g_topout:["TOP OUT","탑 아웃"],
  g_clear:["CLEAR","클리어"],
  g_time:["TIME","시간"],
  g_timeleft:["TIME LEFT","남은 시간"],
  g_done:["DONE","종료"],
  g_ko:["K.O.","K.O."],
  b_send:["SEND {n}","공격 {n}"],
  b_quad:["TETRIS","테트리스"],
  b_tspin:["T-SPIN","T스핀"],
  b_mini:["T-SPIN MINI","T스핀 미니"],
  b_pc:["PERFECT CLEAR","퍼펙트 클리어"],
  b_b2b:["BACK-TO-BACK ×{n}","백투백 ×{n}"],
  b_combo:["COMBO ×{n}","콤보 ×{n}"]
};
function T(key,vars){
  const row=I18N[key];
  if(!row) return key;
  let s=row[LANGS.indexOf(CFG.lang)]||row[0];
  if(vars) for(const k in vars) s=s.split("{"+k+"}").join(vars[k]);
  return s;
}
/* The clear banner reads the same in every language — English is index 0 of
   every row regardless of which language is live, so this is T() with the
   language pinned rather than a second string table. */
function EN(key,vars){
  const row=I18N[key];
  if(!row) return key;
  let s=row[0];
  if(vars) for(const k in vars) s=s.split("{"+k+"}").join(vars[k]);
  return s;
}
function applyLang(){
  if(!LANGS.includes(CFG.lang)) CFG.lang="en";
  document.documentElement.lang = CFG.lang;
  $$("[data-i18n]").forEach(el=>{
    el.textContent=T(el.dataset.i18n);
    delete el.dataset.orig;
  });
  $$("[data-i18n-ph]").forEach(el=>{ el.placeholder=T(el.dataset.i18nPh); });
  $$("[data-i18n-aria]").forEach(el=>{ el.setAttribute("aria-label",T(el.dataset.i18nAria)); });
}

/* 1 · AUDIO — tiny WebAudio synth, no assets */
const Sfx = (()=>{
  let ac=null, master=null;
  /* .20 is the mix; the setting scales it, so full volume is the level every
     sound below was balanced against. */
  const level = () => .20*clamp(CFG.vol,0,100)/100;
  function ctx(){
    if(!ac){
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value=level(); master.connect(ac.destination);
    }
    if(ac.state==="suspended") ac.resume();
    return ac;
  }
  function blip(freq,dur=.07,type="square",vol=1,slide=0){
    if(!CFG.snd) return;
    try{
      const c=ctx(), t=c.currentTime;
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.9*vol,t+.006);
      g.gain.exponentialRampToValueAtTime(.0008,t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  function noise(dur=.2,vol=.5){
    if(!CFG.snd) return;
    try{
      const c=ctx(), n=Math.floor(c.sampleRate*dur);
      const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
      const s=c.createBufferSource(); s.buffer=buf;
      const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1400; f.Q.value=.8;
      const g=c.createGain(); g.gain.value=vol;
      s.connect(f); f.connect(g); g.connect(master); s.start();
    }catch(e){}
  }
  return {
    unlock(){ try{ctx();}catch(e){} },
    setVol(){ if(master) master.gain.value=level(); },
    move(){ blip(300,.035,"square",.28); },
    rotate(){ blip(460,.045,"square",.32); },
    lock(){ blip(150,.07,"triangle",.5,-60); },
    hold(){ blip(620,.07,"sine",.4,140); },
    clear(n){
      const base=[0,523,587,659,784][n]||523;
      [0,1,2].forEach((i)=>setTimeout(()=>blip(base*Math.pow(1.26,i),.14,"sine",.42+n*.06),i*38));
      if(n>=4) noise(.3,.4);
    },
    tspin(){ [0,1,2,3].forEach(i=>setTimeout(()=>blip(392*Math.pow(1.19,i),.11,"sawtooth",.3),i*45)); },
    garbage(){ noise(.22,.5); blip(90,.16,"square",.35,-30); },
    ko(){ [0,1,2,3,4].forEach(i=>setTimeout(()=>blip(880/Math.pow(1.22,i),.18,"sawtooth",.4),i*60)); },
    win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,.24,"sine",.5),i*110)); },
    count(){ blip(440,.09,"sine",.3); },
    go(){ blip(880,.18,"sine",.45,140); },
    ui(){ blip(700,.03,"sine",.22); }
  };
})();

/* 2 · TETROMINOES — SRS states (0 spawn, 1 cw, 2 180, 3 ccw) and kicks */
// Spawn state only: the other three are quarter turns of the same box.
const SHAPES = {
  I:["....","IIII","....","...."],
  J:["J..","JJJ","..."],  L:["..L","LLL","..."],  O:["OO","OO"],
  S:[".SS","SS.","..."],  T:[".T.","TTT","..."],  Z:["ZZ.",".ZZ","..."]
};
const TYPES = ["I","J","L","O","S","T","Z"];

/* [dx, dy], dy flipped for a downward-positive y axis. Every anticlockwise turn
   is its clockwise partner negated, so only the four forward rows are listed. */
const kicks = fwd => {
  const t={};
  for(const k in fwd){
    t[k]=fwd[k];
    t[k[2]+">"+k[0]]=fwd[k].map(([x,y])=>[-x,-y]);
  }
  return t;
};
const KICK_JLSTZ = kicks({
  "0>1":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
  "1>2":[[0,0],[1,0],[1,1],[0,-2],[1,-2]],
  "2>3":[[0,0],[1,0],[1,-1],[0,2],[1,2]],
  "3>0":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]]
});
const KICK_I = kicks({
  "0>1":[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],
  "1>2":[[0,0],[-1,0],[2,0],[-1,-2],[2,1]],
  "2>3":[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],
  "3>0":[[0,0],[1,0],[-2,0],[1,2],[-2,-1]]
});

// Occupied cell offsets for every type and rotation, turned out of the spawn box.
const CELLS = {};
for(const t of TYPES){
  let rows=SHAPES[t];
  CELLS[t]=[0,1,2,3].map(()=>{
    const out=[];
    rows.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(ch!==".") out.push([x,y]); }));
    rows=rows.map((_,y)=>rows.map(r=>r[y]).reverse().join(""));
    return out;
  });
}

/* The outline a shape casts, in cell units, worked out once here for each of
   the twenty-eight states rather than per frame from the cells. It belongs
   beside the states and not in the renderer: which sides of a piece are its
   sides is a fact about the shape, and the shapes are already made once and
   turned three times.

   Every side with nothing on the other side of it is taken, wound so the
   piece is always on the same hand. That leaves each corner with exactly one
   edge arriving and one leaving, so the outline is walked by following them,
   and it comes back as one closed loop: no tetromino touches itself corner to
   corner, which is the only thing that would fork the walk. The points that
   fall in the middle of a straight run are dropped on the way out, so what is
   kept is the corners and nothing else. */
function traceOutline(cells){
  const at=new Set(cells.map(([x,y])=>x+","+y));
  const has=(x,y)=>at.has(x+","+y);
  const step=new Map();
  for(const [x,y] of cells){
    if(!has(x,y-1)) step.set(x+","+y,         [x+1,y]);
    if(!has(x+1,y)) step.set((x+1)+","+y,     [x+1,y+1]);
    if(!has(x,y+1)) step.set((x+1)+","+(y+1), [x,y+1]);
    if(!has(x-1,y)) step.set(x+","+(y+1),     [x,y]);
  }
  // the top-left cell's top-left corner is on the outline whatever the shape
  const s=cells.reduce((a,b)=> b[1]<a[1]||(b[1]===a[1]&&b[0]<a[0]) ? b : a);
  const loop=[]; let p=s;
  do{ loop.push(p); p=step.get(p[0]+","+p[1]); }while(p && (p[0]!==s[0]||p[1]!==s[1]));
  return loop.filter((p,i)=>{
    const a=loop[(i+loop.length-1)%loop.length], b=loop[(i+1)%loop.length];
    return !((a[0]===p[0]&&p[0]===b[0]) || (a[1]===p[1]&&p[1]===b[1]));
  });
}
const OUTLINE = {};
for(const t of TYPES) OUTLINE[t]=CELLS[t].map(traceOutline);

/* The NES skin has no per-piece colour. A level dresses the whole well in
   three tiles, and every piece is one of the three — so the ten palettes
   below are the skin, and the piece only picks a slot in whichever is up.
   Each row is [white, first colour, second colour], converted from the NES
   palette indices the original addressed them by, kept in the comment so a
   colour can be checked against the hardware rather than against taste. */
const NES_PALETTES = [
  ["#fcfcfc","#3cbcfc","#0058f8"],   // 30 21 12
  ["#fcfcfc","#b8f818","#00a800"],   // 30 29 1A
  ["#fcfcfc","#f878f8","#d800cc"],   // 30 24 14
  ["#fcfcfc","#58d854","#0058f8"],   // 30 2A 12
  ["#fcfcfc","#58f898","#e40058"],   // 30 2B 15
  ["#fcfcfc","#6888fc","#58f898"],   // 30 22 2B
  ["#fcfcfc","#7c7c7c","#f83800"],   // 30 00 16
  ["#fcfcfc","#a80020","#6844fc"],   // 30 05 13
  ["#fcfcfc","#f83800","#0058f8"],   // 30 16 12
  ["#fcfcfc","#fca044","#f83800"]    // 30 27 16
];
/* Which slot a piece takes. The three pieces that are their own mirror take
   the pale tile; the other four pair up across the mirror pairs rather than
   along them — L with Z, and J with S. There is no rule behind that to
   re-derive, so the table is the fact. Do not "correct" it into J with L and
   S with Z: that is the tidy version, and it is not the one on the cartridge. */
const NES_SLOT = {T:0,O:0,I:0, L:1,Z:1, J:2,S:2, G:3};
/* Darker than any palette colour, and the one tile drawn without a highlight:
   a level whose own colour is grey (there is one) would otherwise make a row
   you were given look like a row you placed. */
const NES_GARBAGE = "#4a4a4a";

/* The palette this frame is drawn in. Set once per frame from the run, so
   nothing that draws a tile has to be handed the game to find out. */
let PAL = NES_PALETTES[0];
/* The one mode whose palette climbs with the level. Every other mode draws
   one at the start and keeps it, so a sprint, a match or a speed run is one
   set of colours from beginning to end — speed has levels, but it is not
   what the run is about, and a palette changing under a five-second clock
   reads as a fault rather than as progress. */
const PAL_BY_LEVEL = {solo:1};
let PAL_PICK = 0;
const palFor = g => NES_PALETTES[ PAL_BY_LEVEL[g.mode]
  ? (g.level-1) % NES_PALETTES.length
  : PAL_PICK ];

/* 3 · GAME CORE */
const COLS=10, VIS_ROWS=20, BUFFER=2, ROWS=VIS_ROWS+BUFFER;

function gravityFor(level){
  const l = Math.min(level,20);
  return Math.pow(0.8 - (l-1)*0.007, l-1) * 1000;
}
const COMBO_TABLE=[0,0,1,1,1,2,2,3,3,4,4,4,4,5];

/* Speed mode: how long a well may go without a line before it is called. The
   three are far enough apart to be different games rather than three settings
   of one — fifteen seconds is room to build, five is not. */
const SPEED_LIMITS={easy:15000, normal:10000, hard:5000};

/* Versus comes in two rules. "attack" is the one the netcode was built for:
   clears cross as garbage and the last well standing wins. "score" sends
   nothing at all — it is a room of solo runs sharing one three-minute clock,
   settled on points. Three minutes is long enough for a stack to be worth
   building and short enough that nobody is waiting on a survivor.

   The rule is the host's to pick, and travels with the seed: it is decided
   once, in the lobby, and every well in the match runs under the same one. */
const MATCH_MS=180000;
let NET_RULE="attack";

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
let NET_SEED = 0;

class Bag {
  constructor(seed){ this.q=[]; this.rand = seed ? mulberry32(seed) : Math.random; }
  fill(){
    const b=TYPES.slice();
    for(let i=b.length-1;i>0;i--){
      const j=Math.floor(this.rand()*(i+1));
      [b[i],b[j]]=[b[j],b[i]];
    }
    this.q.push(...b);
  }
  next(){ while(this.q.length<8) this.fill(); return this.q.shift(); }
  peek(n){ while(this.q.length<n+2) this.fill(); return this.q.slice(0,n); }
}

class Game {
  constructor(mode="solo"){
    this.mode = mode;
    this.diff = CFG.speedDiff;
    this.rule = mode==="versus" ? NET_RULE : "attack";
    /* Zero outside a score match, and every test below reads as "no clock". */
    this.clock = this.rule==="score" ? MATCH_MS : 0;
    this.left  = this.clock;
    /* Whether a clear crosses the wire. The one switch the score rule needs:
       it gates the send and the receive together, so no garbage can arrive
       for a well that cannot answer it. */
    this.attacks = this.rule!=="score";
    /* Zero for every other mode, and every test below reads as "no fuse". */
    this.limit = mode==="speed" ? SPEED_LIMITS[this.diff]||SPEED_LIMITS.normal : 0;
    this.fuse  = this.limit;
    this.timeout = false;              // died on the clock rather than the stack
    this.away = false;                 // out because the tab went away, not the stack
    this.doneAt=0; this.settled=false; // the tally a score match ends on
    this.board = Array.from({length:ROWS},()=>new Array(COLS).fill(null));
    this.bag = new Bag(mode==="versus" ? NET_SEED : 0);
    this.hold = null; this.holdUsed = false;
    this.score=0; this.lines=0; this.level=1;
    this.combo=-1; this.b2b=-1;
    this.attackSent=0; this.attackRecv=0;
    this.pendingGarbage=[];
    this.garbageHole=rnd(COLS);
    this.over=false; this.won=false; this.paused=false;
    this.startedAt=now(); this.endedAt=0;
    this.pieceCount=0;
    this.dropTimer=0; this.lockTimer=0; this.lockResets=0; this.grounded=false;
    this.clearing=null;
    this.lastAction="";
    this.lastKick=0;
    this.events=[];
    this.stats={quad:0,tspin:0,pc:0,maxCombo:0};
    this.spawn();
  }

  /* piece lifecycle */
  spawn(type){
    this.cur = {
      t: type || this.bag.next(),
      r: 0,
      x: 0, y: 0
    };
    this.cur.x = this.cur.t==="O" ? 4 : 3;
    // Pieces enter on the first visible row and slide up into the buffer when the
  // stack is in the way — the headroom other guideline games give you.
    let y=BUFFER;
    while(y>0 && this.collides(this.cur.x,y,this.cur.r)) y--;
    this.cur.y = y;
    this.holdUsed = false;
    this.dropTimer = 0; this.lockTimer=0; this.lockResets=0; this.grounded=false;
    this.lastAction=""; this.lastKick=0;
    this.pieceCount++;
    if(this.collides(this.cur.x,this.cur.y,this.cur.r)){
      this.die();
    }
  }

  cells(x,y,r,t){ return CELLS[t||this.cur.t][r].map(([cx,cy])=>[x+cx,y+cy]); }

  collides(x,y,r,t){
    for(const [cx,cy] of this.cells(x,y,r,t)){
      if(cx<0||cx>=COLS||cy>=ROWS) return true;
      if(cy>=0 && this.board[cy][cx]) return true;
    }
    return false;
  }

  move(dx,dy){
    if(this.over||this.clearing) return false;
    if(this.collides(this.cur.x+dx,this.cur.y+dy,this.cur.r)) return false;
    this.cur.x+=dx; this.cur.y+=dy;
    this.lastAction = "move";
    this.touchLockReset();
    return true;
  }

  rotate(dir){
    if(this.over||this.clearing) return false;
    const from=this.cur.r, to=(from+dir+4)%4;
    if(this.cur.t==="O"){ this.cur.r=to; return true; }
    const table = this.cur.t==="I" ? KICK_I : KICK_JLSTZ;
    const kicks = table[from+">"+to];
    for(let i=0;i<kicks.length;i++){
      const [dx,dy]=kicks[i];
      if(!this.collides(this.cur.x+dx,this.cur.y+dy,to)){
        this.cur.x+=dx; this.cur.y+=dy; this.cur.r=to;
        this.lastAction="rot"; this.lastKick=i;
        this.touchLockReset();
        return true;
      }
    }
    return false;
  }

  touchLockReset(){
    if(this.grounded && this.lockResets<15){ this.lockTimer=0; this.lockResets++; }
  }

  holdPiece(){
    if(this.over||this.holdUsed||this.clearing) return false;
    const swap=this.hold;
    this.hold=this.cur.t;
    this.holdUsed=true;
    if(swap) this.spawn(swap); else this.spawn();
    this.holdUsed=true;
    return true;
  }

  ghostY(){
    let y=this.cur.y;
    while(!this.collides(this.cur.x,y+1,this.cur.r)) y++;
    return y;
  }

  softDrop(){
    if(this.move(0,1)){ this.score+=1; this.dropTimer=0; return true; }
    return false;
  }

  hardDrop(){
    if(this.over||this.clearing) return;
    const gy=this.ghostY(), dist=gy-this.cur.y;
    this.cur.y=gy; this.score+=dist*2;
    if(dist>0) this.lastAction="move";
    this.lock(true);
  }

  detectSpin(){
    if(this.cur.t!=="T"||this.lastAction!=="rot") return null;
    const bx=this.cur.x, by=this.cur.y;
    const occ=(x,y)=> x<0||x>=COLS||y>=ROWS ? true : (y<0 ? false : !!this.board[y][x]);
    const corners=[[bx,by],[bx+2,by],[bx,by+2],[bx+2,by+2]];
    const filled=corners.map(([x,y])=>occ(x,y));
    const total=filled.filter(Boolean).length;
    if(total<3) return null;
    const FRONT={0:[0,1],1:[1,3],2:[2,3],3:[0,2]}[this.cur.r];
    const frontCount = FRONT.filter(i=>filled[i]).length;
    if(frontCount===2 || this.lastKick===4) return "tspin";
    return "mini";
  }

  /* locking, clearing, scoring */
  lock(hard){
    const spin=this.detectSpin();
    const cells=this.cells(this.cur.x,this.cur.y,this.cur.r);
    // Lock out: nothing of the piece inside the visible well when it came to rest.
    if(cells.every(([,cy])=>cy<BUFFER)){ this.die(); return; }
    for(const [cx,cy] of cells){
      if(cy<0){ this.die(); return; }
      this.board[cy][cx]=this.cur.t;
    }
    if(hard) this.events.push({e:"drop"});
    const rows=[];
    for(let y=0;y<ROWS;y++) if(this.board[y].every(c=>c)) rows.push(y);

    this.resolveClear(rows,spin);
  }

  resolveClear(rows,spin){
    const n=rows.length;
    if(n===0){
      this.combo=-1;
      if(spin){ this.events.push({e:"text",text:EN(spin==="mini"?"b_mini":"b_tspin"),kind:"spin"}); Sfx.tspin(); }
      this.events.push({e:"locked"});
      Sfx.lock();
      this.applyGarbage();
      this.spawn();
      return;
    }

    this.fuse=this.limit;              // any line at all buys the whole clock back
    this.combo++;
    this.stats.maxCombo=Math.max(this.stats.maxCombo,this.combo);
    const difficult = n===4 || (spin==="tspin"&&n>0) || (spin==="mini"&&n>0);
    if(difficult) this.b2b++; else this.b2b=-1;

    let base;
    if(spin==="tspin")      base=[0,800,1200,1600][n]||1600;
    else if(spin==="mini")  base=[0,200,400][n]||400;
    else                    base=[0,100,300,500,800][n];
    let pts = base*this.level;
    if(this.b2b>0) pts=Math.floor(pts*1.5);
    pts += (this.combo>0 ? 50*this.combo*this.level : 0);
    this.score += pts;

    let atk;
    if(spin==="tspin")      atk=[0,2,4,6][n]||6;
    else if(spin==="mini")  atk=[0,0,1][n]||1;
    else                    atk=[0,0,1,2,4][n];
    if(this.b2b>0) atk+=1;
    atk += COMBO_TABLE[Math.min(this.combo,COMBO_TABLE.length-1)];

    const willBeEmpty = this.board.every((row,y)=> rows.includes(y) || row.every(c=>!c));
    if(willBeEmpty){ atk+=10; this.score+=3500*this.level; this.stats.pc++; }

    // Only the quad keeps a line-count name; single/double/triple say nothing.
    let label = spin ? EN(spin==="mini"?"b_mini":"b_tspin") : (n===4 ? EN("b_quad") : "");
    if(willBeEmpty) label=EN("b_pc");
    if(label) this.events.push({e:"text",text:label,kind: willBeEmpty?"pc" : (n===4||spin) ? "big":"norm"});
    if(this.b2b>0) this.events.push({e:"text",text:EN("b_b2b",{n:this.b2b}),kind:"b2b"});
    if(this.combo>0) this.events.push({e:"text",text:EN("b_combo",{n:this.combo}),kind:"combo"});
    if(n===4) this.stats.quad++;
    if(spin) this.stats.tspin++;

    Sfx.clear(n);

    let out=atk;
    while(out>0 && this.pendingGarbage.length){
      const g=this.pendingGarbage[0];
      const take=Math.min(out,g.lines);
      g.lines-=take; out-=take;
      if(g.lines<=0) this.pendingGarbage.shift();
    }
    if(out>0 && this.attacks){ this.attackSent+=out; this.events.push({e:"attack",lines:out}); }

    this.lines += n;
    this.level = this.mode==="sprint" ? 1 : Math.floor(this.lines/10)+1;

    /* The board collapses right here so the next piece — spawned below,
       immediately — has real ground to fall onto. But the drop should still
       read as a beat, not an instant snap: `preDrop` is a snapshot of the
       stack exactly as it stood the instant the lines cleared, with only
       those lines blanked, and the renderer draws it in place of the live
       board for CLEAR_MS. Nothing here reads it back — it is scenery, held
       up in front of a stack that has already moved. */
    const preDrop = this.board.map(row=>[...row]);
    // What each cleared cell was, read off before the splice erases it — the
    // spark burst is colored per column from this, not the frozen preDrop
    // (which has the same rows already blanked, for the hold-and-drop above).
    const clearedCells = rows.map(y=>preDrop[y].slice());
    for(const y of rows) preDrop[y] = new Array(COLS).fill(null);

    for(const y of [...rows].sort((a,b)=>a-b)){
      this.board.splice(y,1);
      this.board.unshift(new Array(COLS).fill(null));
    }
    this.clearing = {board:preDrop, t:0};
    this.events.push({e:"clear",rows,cells:clearedCells,n,spin,perfect:willBeEmpty});

    if(this.mode==="sprint" && this.lines>=40){ this.win(); return; }
    this.applyGarbage();
    this.spawn();
  }

  /* garbage */
  queueGarbage(lines){
    if(lines<=0||this.over||!this.attacks) return;
    this.attackRecv+=lines;
    this.pendingGarbage.push({lines, at:now()});
  }
  pendingCount(){ return this.pendingGarbage.reduce((s,g)=>s+g.lines,0); }

  applyGarbage(){
    let total=this.pendingCount();
    if(total<=0) return;
    total=Math.min(total,8);
    this.pendingGarbage=[];
    for(let i=0;i<total;i++){
      if(Math.random()<0.3) this.garbageHole=rnd(COLS);
      const row=new Array(COLS).fill("G");
      row[this.garbageHole]=null;
      // Anything pushed past the top of the buffer means the well overflowed.
      if(this.board[0].some(c=>c)){ this.die(); return; }
      this.board.shift();
      this.board.push(row);
    }
    while(this.collides(this.cur.x,this.cur.y,this.cur.r) && this.cur.y>-2) this.cur.y--;
    Sfx.garbage();
    this.events.push({e:"garbage",lines:total});
  }

  /* end states */
  die(){ if(this.over) return; this.over=true; this.endedAt=now(); this.events.push({e:"dead"}); Sfx.ko(); }
  win(){ if(this.over) return; this.over=true; this.won=true; this.endedAt=now(); this.events.push({e:"win"}); Sfx.win(); }

  /* per-frame tick */
  tick(dt, input){
    if(this.over||this.paused) return;

    /* Ahead of the clear animation, unlike the fuse below: a score match is
       three minutes of the same clock for everyone in it, and a well that
       cleared more lines would otherwise still be playing long after the
       others had stopped. The countdown costs nothing either way — tick() is
       not called until it is over. */
    if(this.clock){
      this.left -= dt;
      if(this.left<=0){ this.left=0; this.timeout=true; this.die(); return; }
    }

    if(this.clearing){
      this.clearing.t += dt;
      if(this.clearing.t>=CLEAR_MS) this.clearing=null;
      return;
    }

    /* Runs only while a piece is actually in play: the countdown, a pause and
       the clear hold all return above this, and none of them is time the
       player had to spend. */
    if(this.limit){
      this.fuse -= dt;
      if(this.fuse<=0){ this.fuse=0; this.timeout=true; this.die(); return; }
    }

    const g = input.soft ? Math.min(gravityFor(this.level), 1000/CFG.sdf) : gravityFor(this.level);
    this.dropTimer += dt;
    while(this.dropTimer>=g){
      this.dropTimer-=g;
      if(!this.collides(this.cur.x,this.cur.y+1,this.cur.r)){
        this.cur.y++;
        if(input.soft) this.score+=1;
        this.lastAction="move";
      } else break;
    }

    const landed = this.collides(this.cur.x,this.cur.y+1,this.cur.r);
    if(landed){
      if(!this.grounded){ this.grounded=true; this.lockTimer=0; }
      this.lockTimer += dt;
      if(this.lockTimer>=LOCK_MS || this.lockResets>=15 && this.lockTimer>=LOCK_MS*0.5) this.lock();
    }else{
      this.grounded=false; this.lockTimer=0;
    }
  }

  snapshot(){
    let s="";
    for(let y=BUFFER;y<ROWS;y++)
      for(let x=0;x<COLS;x++)
        s += this.board[y][x] ? this.board[y][x] : ".";
    if(!this.over && this.cur){
      const arr=[...s];
      for(const [cx,cy] of this.cells(this.cur.x,this.cur.y,this.cur.r)){
        const ry=cy-BUFFER;
        if(ry>=0&&ry<VIS_ROWS&&cx>=0&&cx<COLS) arr[ry*COLS+cx]=this.cur.t.toLowerCase();
      }
      s=arr.join("");
    }
    return s;
  }
}
const LOCK_MS=500, CLEAR_MS=200;

/* 4 · RENDERER — drawn in CSS pixels, every distance derived from the cell */
/* alpha:true (the default) rather than the opaque fast path this canvas used
   to ask for: with alpha:false a clearRect can't produce a transparent pixel
   at all, it only resets to opaque black — which left no way for a custom
   background to show through the space around the well, hold and next boxes
   that render() otherwise leaves untouched. */
const cv=$("#cv"), ctx=cv.getContext("2d");
let DPR=1, CW=0, CH=0;
let L=null;

/* Where the well sits inside a screen of the given size. Pure: the settings
   preview asks the same question with a different box. */
/* `foes` is how many other wells share the screen, nought to three. One
   opponent gets a well the same size as your own — a match is still a match
   at two — but from two up they read as a side column instead: stacked to
   fill the same height your own well stands, each one shorter as another
   is added, because three opponents at your own size would leave the one
   well that matters too small to read.

   They go either beside your well or under it, and which is better is not
   something an aspect ratio can be trusted to say: the canvas is close to
   square even on a wide window, because the control pads take the width
   first. So both are solved and the one that leaves your own well larger
   wins, which is the thing either arrangement is really competing over. */
const FOE_BAND=[0,0.20,0.22,0.24];        // share of the height they take when stacked under
/* The well takes four fifths of the screen at most, however much height there
   is to spare. Sized purely by the room available it grows until the margins
   above and below are the only thing holding it off the edge of the canvas,
   and the banners, the fuse and the next column all read as crowded against a
   board that tall. Every other distance follows the cell, so capping it keeps
   the ten-by-twenty ratio and narrows the board with it. */
const WELL_MAX_H=0.80;
function solveWell(W,H,foes,below){
  const gut=Math.max(4,Math.min(W,H)*0.018);
  const topM=Math.max(6,H*0.030), botM=Math.max(6,H*0.030);
  let availH=Math.max(40,H-topM-botM);
  const beside=foes>0&&!below;

  let band=0;
  if(foes&&below){ band=availH*FOE_BAND[foes]; availH=Math.max(40,availH-band-gut*1.4); }

  /* One opponent is a second column your own width; from two up they are
     one column stacked to your own height instead, so it is always one
     column's worth of width being budgeted here, never foes' worth — the
     approximation 1/foes stands in for the stack's exact cell size, which
     depends on bh and isn't known until cell is. */
  const k=beside?(foes===1?1:1/foes):0;
  const span=15.7+(beside?10*k+1.1:0);
  const parts=c=>{
    const bw=c*10, gw=foes?Math.max(3,c*0.26):0;
    const colW=clamp((W-bw-gw-c*10*k-gut*(beside?3.2:0.8))/2, c*2.7, c*4.4);
    const strip=beside?gut*1.6+bw*k:0;
    return {bw,gw,colW,strip,groupW:colW+gw+bw+colW+strip};
  };
  let cell=Math.max(4,Math.min(availH/20.1,H*WELL_MAX_H/20,(W-gut*2)/span));
  let g=parts(cell);
  const usable=W-gut*(beside?1.8:0.8);
  if(g.groupW>usable){ cell=Math.max(4,cell*usable/g.groupW); g=parts(cell); }
  const {bw,gw,colW,groupW}=g, bh=cell*20;
  const x0=(W-groupW)/2;
  // no gaps between them, so the three boxes read as one shape
  const x=x0+colW+gw;
  const y=topM+(availH-bh)/2;

  const opps=[];
  if(beside&&foes===1){
    // a match, not a preview: the one opponent reads at your own size
    const oc=cell, ow=oc*10;
    opps.push({x:x+bw+colW+gut*1.6,y,w:ow,h:oc*20,cell:oc});
  }else if(beside){
    // stacked to fill bh exactly, so the column reads as one shape the same
    // height as your own well rather than a shorter guess at it
    const stackGut=gut*0.8;
    const slotH=(bh-(foes-1)*stackGut)/foes, oc=slotH/20, ow=oc*10;
    const ox=x+bw+colW+gut*1.6;
    let oy=y;
    for(let i=0;i<foes;i++){ opps.push({x:ox,y:oy,w:ow,h:oc*20,cell:oc}); oy+=oc*20+stackGut; }
  }else if(foes){
    // height-bound almost always: a band this short sets the size, not the width
    const lane=(W-gut*2-(foes-1)*gut*0.9)/foes;
    const oc=Math.max(2,Math.min(band/20,lane/10));
    const ow=oc*10, tot=foes*ow+(foes-1)*gut*0.9;
    let ox=(W-tot)/2, oy=topM+availH+gut*1.4+(band-oc*20)/2;
    for(let i=0;i<foes;i++){ opps.push({x:ox,y:oy,w:ow,h:oc*20,cell:oc}); ox+=ow+gut*0.9; }
  }
  return {x, y, w:bw, h:bh, cell, gut, headerH:topM, colW, gw, x0, opps};
}
function wellBox(W,H,foes){
  foes=Math.max(0,Math.min(3,foes|0));
  if(!foes) return solveWell(W,H,0,false);
  const beside=solveWell(W,H,foes,false), under=solveWell(W,H,foes,true);
  return under.cell>beside.cell ? under : beside;
}

/* How many opponent wells are on screen; wellBox() sizes them all together. */
let TWIN=0;

function computeLayout(){
  const b=wellBox(CW,CH,TWIN);
  const {cell,gut,headerH,colW,gw,x0}=b;
  const tile=colW/4.4;                       // hold: sized by its column, as ever
  const holdH=cell*1.15+tile*2.6;
  /* The next column runs three fifths of the well and no further. Its caption
     and five previews divide that height between them, so the preview size
     follows from the step rather than the step from the preview. There is
     room for a full-sized one at most heights; where there is not, the list
     stays inside its three fifths and the previews give way instead. */
  const nextH=b.h*0.6;
  const step=(nextH-cell*1.2)/5;
  const ntile=Math.min(tile,step/3.0);
  /* The fuse hangs below the well rather than inside it: the floor of the well
     is where pieces land, and a bar drawn over it would be read as a row. It
     takes what the bottom margin has and no more. */
  const below=Math.max(0,CH-(b.y+b.h));
  const fuseH=Math.max(3,Math.min(cell*0.26,below*0.40));
  const fuseGap=Math.max(2,Math.min(cell*0.34,(below-fuseH)*0.42));
  L={
    cell,gut,headerH,tile,ntile,step,
    bx:b.x,by:b.y,bw:b.w,bh:b.h,
    gx:x0+colW,gy:b.y,gw,gh:b.h,
    hold:{x:x0,y:b.y,w:colW,h:holdH},
    hud :{x:x0,y:b.y+b.h-cell*7.6,w:colW,h:cell*7.6,r:x0+colW},
    next:{x:b.x+b.w,y:b.y,w:colW,h:nextH},
    fuse:{x:b.x,y:b.y+b.h+fuseGap,w:b.w,h:fuseH},
    opps:b.opps
  };
}

function resizeCanvas(){
  const r=cv.getBoundingClientRect();
  CW=Math.max(1,r.width); CH=Math.max(1,r.height);
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  // Very large screens would otherwise mint an enormous backing store.
  const MAXPX=9e6;
  if(CW*CH*DPR*DPR>MAXPX) DPR=Math.max(1,Math.sqrt(MAXPX/(CW*CH)));
  const w=Math.round(CW*DPR), h=Math.round(CH*DPR);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  computeLayout();
}
new ResizeObserver(resizeCanvas).observe(cv);

const TS=m=>Math.max(9,L.cell*m);

// ---- drawing helpers ----
const INK = {
  bg:"#0a0a0c", well:"#050507", grid:"rgba(255,255,255,.20)",
  line:"rgba(255,255,255,.20)", frame:"#ffffff",
  fg:"#ededf0", dim:"#c4c4cc", faint:"#9a9aa5",
  danger:"#ff5a5f"
};

/* Short of opaque, so a custom background tints through the stack itself
   rather than only the space around it. */
const WELL_A = 0.7;

function rgba(hex,a){
  const n=parseInt(hex.slice(1),16);
  return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")";
}

function label(txt,x,y,maxW){
  const sz=maxW?Math.min(TS(0.5),maxW*0.21):TS(0.5);
  textFit(txt,x,y,sz,INK.faint,"left",600,sz*0.13,maxW||1e5);
}
/* What colour this piece is under whichever skin is up. Everything that tints
   itself after a piece — the clearing dust, and anything added in that vein
   later — asks here rather than reaching into a palette itself, so one
   setting covers the board and what comes off it. */
function inkOf(type){
  return type==="G" ? NES_GARBAGE : PAL[NES_SLOT[type]||0];
}

/* The three NES tiles, laid out on the eight-unit grid the originals were
   drawn on. All three are solid: the pale one is a coloured frame with white
   inside it, not a hole — the white is as much the block as the colour is.
   The two filled ones carry a white bracket down their top-left corner, and
   the frame of the pale one is the same colour as the darker filled one, so a
   level reads as two colours rather than three. Square corners: a rounded
   pixel is the one thing that would give the era away. */
function block(x,y,s,type,alpha=1){
  const p=Math.max(0.5,s*0.075), w=s-p*2, u=w/8, bx=x+p, by=y+p;
  const slot=NES_SLOT[type];
  ctx.globalAlpha=alpha;
  if(type==="G"){
    ctx.fillStyle=NES_GARBAGE; ctx.fillRect(bx,by,w,w);
  }else if(slot===0){
    ctx.fillStyle=PAL[2]; ctx.fillRect(bx,by,w,w);
    ctx.fillStyle=PAL[0]; ctx.fillRect(bx+u,by+u,w-u*2,w-u*2);
    ctx.fillRect(bx,by,u,u);                  // and the pixel that sits outside the frame
  }else{
    ctx.fillStyle=PAL[slot]; ctx.fillRect(bx,by,w,w);
    ctx.fillStyle=PAL[0];
    ctx.fillRect(bx+u,by+u,u*2,u);            // along the top…
    ctx.fillRect(bx+u,by+u,u,u*2);            // …and down the left
  }
  ctx.globalAlpha=1;
}

/* The ghost is one outline around the whole piece rather than a box per cell.
   The cell edges inside a piece are the ones you do not need: what is being
   read off the bottom of the well is the shape and where its sides fall, and
   four separate boxes make an S and an O the same answer — a count of cells —
   until you look twice. So only the edges with nothing of the piece on the
   other side are drawn, and the piece arrives as its own silhouette.

   Fixed white regardless of theme, and the one thing on the board a theme
   never dresses. A mark of where a piece will land is not the piece: given
   the piece's own ink it competes with the stack it is there to be measured
   against, and unlike the board outline it can't just borrow the theme's
   colour — a theme is free to make that the same colour as the well fills
   with, which the ghost can never afford to. */
const GHOST_A = 0.40;
const GHOST_INK = "#ffffff";
function ghostPiece(type,r,px,py,bx,by,cell){
  const ox=bx+px*cell, oy=by+(py-BUFFER)*cell;
  ctx.save();
  ctx.beginPath();
  OUTLINE[type][r].forEach(([x,y],i)=>{
    const X=ox+x*cell, Y=oy+y*cell;
    i ? ctx.lineTo(X,Y) : ctx.moveTo(X,Y);
  });
  ctx.closePath();
  /* Clipped to the shape and then stroked at twice the width, so the whole
     line lies inside the piece rather than half of it hanging over the stack
     the ghost is resting on. Both passes are the one closed path, which is
     what leaves the corners to the mitre. */
  ctx.clip();
  ctx.globalAlpha=GHOST_A;
  ctx.strokeStyle=GHOST_INK;
  ctx.lineWidth=Math.max(1,cell*0.075)*2;
  ctx.stroke();
  ctx.restore();
}
function text(str,x,y,size,color,align="left",weight=600,spacing=0){
  ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline="alphabetic";
  ctx.font=weight+" "+size+"px "+CANVAS_FONT;
  if(spacing) ctx.letterSpacing=spacing+"px";
  ctx.fillText(str,x,y);
  if(spacing) ctx.letterSpacing="0px";
}
// Fit to maxW: spend the letter-spacing, then shrink, then ellipsis.
function textFit(str,x,y,size,color,align,weight,spacing,maxW){
  let s=size, sp=spacing||0, txt=String(str);
  const wOf=()=>{
    ctx.font=weight+" "+s+"px "+CANVAS_FONT;
    ctx.letterSpacing=sp+"px";
    const w=ctx.measureText(txt).width;
    ctx.letterSpacing="0px";
    return w;
  };
  let w=wOf();
  for(let i=0;i<40 && w>maxW;i++){
    if(sp>0){ sp=0; }
    else if(s>6.5){ s-=Math.max(0.4,s*0.07); }
    else if(txt.length>2){ txt=txt.slice(0,-2)+"…"; }
    else break;
    w=wOf();
  }
  text(txt,x,y,s,color,align,weight,sp);
  return w;
}

function preview(type,cx,cy,s){
  const cells=CELLS[type][0];
  const xs=cells.map(c=>c[0]), ys=cells.map(c=>c[1]);
  const w=(Math.max(...xs)-Math.min(...xs)+1), h=(Math.max(...ys)-Math.min(...ys)+1);
  const ox=cx-w*s/2-Math.min(...xs)*s, oy=cy-h*s/2-Math.min(...ys)*s;
  for(const [x,y] of cells) block(ox+x*s,oy+y*s,s,type);
}

/* particles & floating banners */
/* Two springs, because the fall and the rise are not the same movement. The
   fall is the weight: stiff and damped just past critical, over in three
   frames, because at a given depth a slow sag reads as the well floating
   loose while a drop that quick reads as the rows leaving and the board
   dropping into the space. That spring only ever brings the fall up short —
   it is never allowed to turn the velocity around, or it would fling the
   board back up as fast as it went down and spend the weight it just bought.
   The rise is the recovery, and it is slack: most of the way home in a third
   of a second, settled inside three quarters of one. Coming back slower than
   it went is the whole difference between a board that took a hit and a board
   that twitched. */
const BOB_STIFF=0.28,    BOB_DAMP=0.58;      // the fall
const BOB_UP_STIFF=0.04, BOB_UP_DAMP=0.76;   // the return

/* Milliseconds, not life-per-frame like the well-centred banners: a clear
   label is meant to be read as a beat, not lingered on, so its whole life —
   in, held, gone — is under half a second. */
const CLEAR_TXT_IN=100, CLEAR_TXT_HOLD=2000, CLEAR_TXT_OUT=100;
const CLEAR_TXT_MS=CLEAR_TXT_IN+CLEAR_TXT_HOLD+CLEAR_TXT_OUT;

// Full brightness from the first frame — the dust is there the instant the
// line is, not swelling into view — and faded out slowly at the end of its
// life, rather than dimming the whole time it hovers.
const SPARK_FADE_OUT=380;
// A floor on the trim in burst(), not a target: a single tetris alone spawns
// 560 of these, so this only ever bounds sparks left over from earlier bursts.
const SPARK_CAP=500;

const FX = {
  banners:[], clearBanners:[], sparks:[], clearGen:0, clearBannerGen:-1, bob:0, bobV:0,
  banner(txt,kind){
    FX.banners.push({txt,life:1,y:0,big:kind==="big"||kind==="pc"});
    if(FX.banners.length>3) FX.banners.shift();
  },
  /* What a clear says, kept apart from the well-centred banners (GO!, an
     attack sent) so it can live under the hold box, in its own font, and
     fade both in and out fast rather than pop in and linger. A quad, a b2b
     and a combo line all belong to the same clear and are meant to stack —
     drainEvents bumps clearGen once per drain, so every "text" event from
     one clear shares it, and only the first of a NEW clear's texts finds a
     stale generation and clears out whatever the last clear left showing. */
  clearText(txt,big){
    if(FX.clearBannerGen!==FX.clearGen){ FX.clearBanners.length=0; FX.clearBannerGen=FX.clearGen; }
    FX.clearBanners.push({txt,big,t:0});
    if(FX.clearBanners.length>3) FX.clearBanners.shift();
  },
  /* A clear pushes the board down and a spring brings it back, weighted by
     how many rows went: a single is a nudge, a quad lands with four times the
     board coming out at once and should be felt as such. Locking a piece is
     the commonest thing in the game and used to bump too, which left the well
     twitching almost continuously — motion that often says nothing is motion
     the eye stops reading, and the one moment worth marking got no more than
     any other. Measured in cells rather than pixels, so the give is the same
     weight of movement on a phone as on a desktop. The quad breaks the run
     of steps rather than continuing it: four rows is the thing the whole
     board is built toward, and an even step would let the one clear worth
     playing for pass as merely the next size up. */
  bump(n){
    if(!CFG.bob) return;
    n=clamp(n,1,4);
    FX.bobV += n===4 ? 1.92 : 0.37+(n-1)*0.30;
  },
  /* A hard drop gives the board its own, much smaller nudge — the piece
     landing, not a line going. Independent of bump() and additive with it,
     so a hard drop that also clears keeps both: the thud of arrival and the
     weight of what it cleared. */
  thud(){
    if(!CFG.bob) return;
    FX.bobV += 0.12;
  },
  /* A cleared cell comes apart into fine, twinkling dust rather than being
     thrown — a dissolve, not an explosion. Each spark launches at a gentle,
     low speed in any direction, then a steady wind out of the left (in
     step()) carries the whole cloud away, sand blowing off the row rather
     than each grain going its own way. Colored from the cell's own type, so
     the dust is what the row was made of. Skipped under reduced motion,
     same as the harness already does for its own transitions — this is the
     one animation in the game that isn't. */
  burst(rows,cells,n){
    if(!L || REDUCED.matches) return;
    const cell=L.cell, per=6+n*2;
    const before=FX.sparks.length;
    rows.forEach((y,ri)=>{
      const cy=L.by+(y-BUFFER+0.5)*cell, rowCells=cells[ri];
      for(let x=0;x<COLS;x++){
        const type=rowCells[x]; if(!type) continue;
        const col = inkOf(type);
        const cx=L.bx+(x+0.5)*cell;
        for(let i=0;i<per;i++){
          const ang=Math.random()*Math.PI*2, spd=cell*(0.015+Math.random()*0.05);
          FX.sparks.push({
            x:cx+(Math.random()-0.5)*cell*0.6, y:cy+(Math.random()-0.5)*cell*0.6,
            vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
            r:cell*(0.045+Math.random()*0.065),   // fewer sparks per burst, so each one's bigger
            t:0, dur:1100+Math.random()*700,
            seed:Math.random()*1000,
            col
          });
        }
      }
    });
    /* The cap only ever gives up the oldest dust still hanging in the air —
       never this burst's own. rows[] runs top row first, so trimming a
       straight 500 off the front here would have thrown away exactly the
       rows spawned first: a tetris (1040 sparks) kept only its bottom two. */
    const spawned=FX.sparks.length-before;
    const cap=Math.max(SPARK_CAP,spawned);
    if(FX.sparks.length>cap) FX.sparks.splice(0,FX.sparks.length-cap);
  },
  step(dt){
    const f=dt/16.67;
    for(let i=FX.banners.length-1;i>=0;i--){
      const b=FX.banners[i]; b.life-=0.012*f; b.y-=0.4*f;
      if(b.life<=0) FX.banners.splice(i,1);
    }
    for(let i=FX.clearBanners.length-1;i>=0;i--){
      const b=FX.clearBanners[i]; b.t+=dt;
      if(b.t>=CLEAR_TXT_MS) FX.clearBanners.splice(i,1);
    }
    for(let i=FX.sparks.length-1;i>=0;i--){
      const p=FX.sparks[i]; p.t+=dt;
      if(p.t>=p.dur){ FX.sparks.splice(i,1); continue; }
      // Light drag and a steady wind out of the left, straight across — no
      // vertical component at all. The flutter is layered on top at draw
      // time (drawSparks), not summed in here: adding a sine to a position
      // every frame integrates it into real drift instead of a bounded
      // wobble.
      p.vx = p.vx*Math.pow(0.985,f) + L.cell*0.003*f;
      p.vy *= Math.pow(0.985,f);
      p.x += p.vx*f;
      p.y += p.vy*f;
    }
    if(FX.bob||FX.bobV){
      if(FX.bobV>0){
        FX.bobV-=FX.bob*BOB_STIFF*f;
        FX.bobV*=Math.pow(BOB_DAMP,f);
        if(FX.bobV<0) FX.bobV=0;        // stops the fall; it does not do the lifting
      }else{
        FX.bobV-=FX.bob*BOB_UP_STIFF*f;
        FX.bobV*=Math.pow(BOB_UP_DAMP,f);
      }
      FX.bob +=FX.bobV*f;
      if(Math.abs(FX.bob)<0.002 && Math.abs(FX.bobV)<0.002){ FX.bob=0; FX.bobV=0; }
    }
  }
};

/* the frame */
function render(g, opp){
  if(!L) resizeCanvas();
  if(!g){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    return;
  }
  const foes=g.mode==="versus"?Math.min(3,(opp||[]).length):0;
  if(TWIN!==foes){ TWIN=foes; computeLayout(); }
  PAL=palFor(g);
  ctx.setTransform(1,0,0,1,0,0);
  /* Cleared rather than filled: INK.bg is exactly the page's own --bg, so a
     transparent canvas over it looks identical with no custom background set,
     and lets one show through the space around the well, hold and next boxes
     when it is — the well itself still paints its own opaque fill below. */
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  /* Applied before anything is drawn, so hold, next and the stats ride down
     with the well — one object taking one hit, not a well jumping inside a
     still frame. */
  if(FX.bob) ctx.translate(0,FX.bob*L.cell);

  drawWell(g);
  drawSparks();
  if(g.mode==="versus") (opp||[]).slice(0,3).forEach((f,i)=>drawOpponent(f,i,g));
  drawGarbageMeter(g);
  drawSpeedBar(g);
  drawHold(g);
  drawClearText();
  drawNext(g);
  drawSide(g);
  if(COUNT>0 && g===G) drawCountdown();
  drawBanners();
  ctx.setTransform(1,0,0,1,0,0);
}

function drawWell(g){
  const {bx,by,bw,bh,cell}=L;

  ctx.fillStyle=rgba(INK.well,WELL_A); ctx.fillRect(bx,by,bw,bh);

  // cell grid, held at ~1.1 CSS px on every display
  if(CFG.grid){
    ctx.strokeStyle=INK.grid; ctx.lineWidth=1.1;
    ctx.beginPath();
    for(let x=1;x<COLS;x++){ ctx.moveTo(bx+x*cell,by); ctx.lineTo(bx+x*cell,by+bh); }
    for(let y=1;y<VIS_ROWS;y++){ ctx.moveTo(bx,by+y*cell); ctx.lineTo(bx+bw,by+y*cell); }
    ctx.stroke();
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(bx,by,bw,bh); ctx.clip();

  /* The live board already has the collapse in it — that happened the
     instant the lines cleared, so the next piece has real ground under it.
     What's drawn here for CLEAR_MS is g.clearing's frozen stack instead: the
     lines are gone, but nothing above them has moved yet, so the drop still
     plays out as a beat rather than an instant snap. A mirrored foe's board
     never shows this, since a clear never crosses the wire. */
  const stack = g.clearing ? g.clearing.board : g.board;

  for(let y=BUFFER;y<ROWS;y++){
    const sy=by+(y-BUFFER)*cell;
    for(let x=0;x<COLS;x++){
      const c=stack[y][x]; if(!c) continue;
      block(bx+x*cell,sy,cell,c);
    }
  }

  if(!g.over && !g.clearing && g.cur){
    if(CFG.ghost){
      const gy=g.ghostY();
      // the shape's own outline, placed: the well's clip takes off whatever
      // of it is still above the buffer
      if(gy!==g.cur.y) ghostPiece(g.cur.t,g.cur.r,g.cur.x,gy,bx,by,cell);
    }
    const lockP = g.grounded ? clamp(g.lockTimer/LOCK_MS,0,1) : 0;
    for(const [cx,cy] of g.cells(g.cur.x,g.cur.y,g.cur.r))
      if(cy>=BUFFER) block(bx+cx*cell,by+(cy-BUFFER)*cell,cell,g.cur.t,1-lockP*0.25);
  }

  ctx.restore();

  // A thin outline, open at the top: pieces enter the well rather than
  // crossing a line into it.
  wellEdge(bx,by,bw,bh,cell);

  if(g.over){
    ctx.fillStyle="rgba(10,10,12,.86)"; ctx.fillRect(bx,by,bw,bh);
    textFit(g.won?T("g_clear"):T("g_topout"),bx+bw/2,by+bh/2,TS(1.0),g.won?INK.fg:INK.danger,"center",600,TS(1.0)*0.14,bw*0.9);
  }
  if(g.paused && !g.over){
    ctx.fillStyle="rgba(10,10,12,.86)"; ctx.fillRect(bx,by,bw,bh);
    textFit(T("g_paused"),bx+bw/2,by+bh/2,TS(0.95),INK.fg,"center",600,TS(0.95)*0.16,bw*0.9);
  }
}

/* Additive blending is what makes a cluster of dust read as one glow rather
   than a handful of separate dots — where two sparks overlap, the light
   adds instead of one occluding the other. Each also twinkles on its own
   slow cycle rather than holding one brightness, which is most of what
   reads as "dust" instead of "dots". Unclipped: a spark drifting past the
   top or sides of the well is the point, not a bug to clip away. */
function drawSparks(){
  if(!FX.sparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const p of FX.sparks){
    const t=p.t, holdEnd=p.dur-SPARK_FADE_OUT;
    const env = t<holdEnd ? 1 : Math.max(0,(p.dur-t)/SPARK_FADE_OUT);
    if(env<=0) continue;
    const twinkle=0.65+0.35*Math.sin((t+p.seed)*0.009);
    const a=env*twinkle;
    // A bounded flutter, recomputed fresh each frame from t rather than
    // accumulated — it can never drift the way summing it into position did.
    const wob=Math.sin((t+p.seed)*0.006)*L.cell*0.08;
    const px=p.x, py=p.y+wob;
    const grad=ctx.createRadialGradient(px,py,0,px,py,p.r);
    grad.addColorStop(0,"#fffdf5");
    grad.addColorStop(0.45,p.col);
    grad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.globalAlpha=a;
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(px,py,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* Drawn last and outside the well's clip, because leaving the well is the
   whole point of it: the beam crosses the meter, the hold, the next queue and
   the stats on its way out, exactly as it crosses the frame in the reference.
   Three stacked passes make the bloom — a wide dim one, a middle one, then
   the core — which holds steadier than a canvas shadow and costs three fills
   a row rather than a blur. Additive, so where the beams of a quad meet they
   burn to white the way the reference frames do. */
/* The fuse: how long this well has left to produce a line. It drains as the
   clock runs down and comes straight back the moment one goes, so what you
   watch is the gap since your last clear, not the run. Red for the last
   third — the point where there is no longer time to build, only to dig. */
function drawSpeedBar(g){
  if(!g.limit) return;
  const b=L.fuse, p=clamp(g.fuse/g.limit,0,1);
  ctx.strokeStyle=INK.line; ctx.lineWidth=1;
  ctx.strokeRect(b.x-.5,b.y-.5,b.w+1,b.h+1);
  if(p<=0) return;
  ctx.fillStyle = p<=0.34 ? INK.danger : INK.dim;
  ctx.fillRect(b.x,b.y,b.w*p,b.h);
}

function drawGarbageMeter(g){
  if(g.mode!=="versus"||!g.attacks) return;
  const {gx,gy,gw,gh,cell}=L;
  const p=g.pendingCount();
  ctx.strokeStyle=INK.line; ctx.lineWidth=1;
  ctx.strokeRect(gx-.5,gy-.5,gw+1,gh+1);
  if(p<=0) return;
  const h=Math.min(gh,p*cell);
  ctx.fillStyle=INK.danger;
  ctx.fillRect(gx,gy+gh-h,gw,h);
  ctx.strokeStyle="rgba(10,10,12,.55)"; ctx.lineWidth=1; ctx.beginPath();
  for(let i=1;i<Math.min(p,20);i++){ const y=gy+gh-i*cell; ctx.moveTo(gx,y); ctx.lineTo(gx+gw,y); }
  ctx.stroke();
}

const pvTile=w=>w/4.4;

/* Three sides of a thin rectangle. The top is left open, so the well reads as
   a vessel that pieces fall into instead of a closed box. */
function wellEdge(x,y,w,h,cell){
  ctx.strokeStyle=INK.frame; ctx.lineWidth=Math.max(1.1,cell*0.055);
  ctx.beginPath();
  ctx.moveTo(x,y); ctx.lineTo(x,y+h); ctx.lineTo(x+w,y+h); ctx.lineTo(x+w,y);
  ctx.stroke();
}


/* Named where they sit, with nothing drawn around them: the well's edge is
   the only frame on the board. */
function caption(b,title){
  const sz=Math.min(TS(0.42),b.w*0.20);
  textFit(title,b.x+L.cell*0.30,b.y+L.cell*0.28+sz,sz,INK.faint,"left",600,sz*0.12,b.w-L.cell*0.6);
}

function drawHold(g){
  const b=L.hold;
  caption(b,T("g_hold"));
  if(g.hold){
    ctx.globalAlpha=g.holdUsed?0.28:1;
    preview(g.hold,b.x+b.w/2,b.y+L.cell*1.15+(b.h-L.cell*1.15)/2,L.tile);
    ctx.globalAlpha=1;
  }
}

// The same face and weight the countdown number is set in — just fit to a
// column instead of the whole well. Shrinks the way textFit() does.
const CLEAR_FONT=s=>`600 ${s}px ${CANVAS_FONT}`;
function clearFit(str,x,y,size,color,maxW){
  let s=size, txt=String(str).toUpperCase();
  const wOf=()=>{ ctx.font=CLEAR_FONT(s); return ctx.measureText(txt).width; };
  for(let i=0;i<40 && wOf()>maxW && s>6.5;i++) s-=Math.max(0.4,s*0.07);
  ctx.font=CLEAR_FONT(s);
  ctx.fillStyle=color; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  ctx.fillText(txt,x,y);
  return s;
}

/* Lower in the hold column, in the gap between the hold box and the stats
   block below it — clear of both, and clear of the well beside it, since
   clearFit never draws past maxW. A line clear used to write across the
   board a new piece was about to fall through; this is the closest a column
   that never moves gets to that. */
function drawClearText(){
  if(!FX.clearBanners.length) return;
  const b=L.hold, cx=b.x+b.w/2, maxW=b.w*0.94;
  let y=L.by+L.bh*0.48-L.cell*2;
  for(const banner of FX.clearBanners){
    const t=banner.t;
    const a = t<CLEAR_TXT_IN ? t/CLEAR_TXT_IN
            : t<CLEAR_TXT_IN+CLEAR_TXT_HOLD ? 1
            : Math.max(0,1-(t-CLEAR_TXT_IN-CLEAR_TXT_HOLD)/CLEAR_TXT_OUT);
    if(a<=0) continue;
    const sz=banner.big?TS(1.1):TS(0.85);
    ctx.globalAlpha=a;
    const used=clearFit(banner.txt,cx,y,sz,INK.fg,maxW);
    ctx.globalAlpha=1;
    y+=used*1.7;
  }
}

function drawNext(g){
  const b=L.next;
  caption(b,T("g_next"));
  const top=b.y+L.cell*1.2;
  g.bag.peek(5).forEach((p,i)=>{
    ctx.globalAlpha=i===0?1:0.5;
    preview(p,b.x+b.w/2,top+L.step*(i+0.5),i===0?L.ntile:L.ntile*0.84);
    ctx.globalAlpha=1;
  });
}

function drawOpponent(opp,i,g){
  const b=L.opps&&L.opps[i];
  if(!b) return;
  const cell=b.w/COLS;
  ctx.fillStyle=rgba(INK.well,WELL_A); ctx.fillRect(b.x,b.y,b.w,b.h);
  if(CFG.grid && cell>5){
    ctx.strokeStyle=INK.grid; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=1;x<COLS;x++){ ctx.moveTo(b.x+x*cell,b.y); ctx.lineTo(b.x+x*cell,b.y+b.h); }
    for(let y=1;y<VIS_ROWS;y++){ ctx.moveTo(b.x,b.y+y*cell); ctx.lineTo(b.x+b.w,b.y+y*cell); }
    ctx.stroke();
  }

  if(opp&&opp.board){
    for(let y=0;y<VIS_ROWS;y++) for(let x=0;x<COLS;x++){
      const c=opp.board[y*COLS+x];
      if(!c||c===".") continue;
      block(b.x+x*cell,b.y+y*cell,cell,c.toUpperCase(),c===c.toLowerCase()?0.85:1);
    }
  }

  wellEdge(b.x,b.y,b.w,b.h,cell);

  const nm=((opp&&opp.name)||T("opponent")).slice(0,12);
  const sz=Math.min(TS(0.42),b.w*0.115);
  /* Under the score rule the standing is the score, so it rides on the name
     line — there is no garbage meter to read it off instead. */
  const race=!!(g&&g.clock);
  textFit(nm,b.x,b.y-sz*0.45,sz,INK.faint,"left",600,sz*0.1,b.w*(race?0.56:1));
  if(race) textFit(((opp&&opp.score)|0).toLocaleString(),b.x+b.w,b.y-sz*0.45,sz,INK.dim,"right",600,0,b.w*0.42);

  if(opp&&opp.dead){
    ctx.fillStyle="rgba(10,10,12,.86)"; ctx.fillRect(b.x,b.y,b.w,b.h);
    textFit(T(race?"g_done":"g_ko"),b.x+b.w/2,b.y+b.h/2,Math.min(TS(1.0),b.w*0.30),race?INK.faint:INK.danger,"center",600,0,b.w*0.9);
  }
}

/* The stats read up from the floor of the board: the last figure sits on the
   well's bottom rule, and however many rows a mode has, they stack above it. */
function drawSide(g){
  const h=L.hud;
  const items = g.mode==="sprint"
    ? [[T("g_left"),Math.max(0,40-g.lines)+"/40"]]
    : g.mode==="versus"
    ? (g.attacks ? [[T("g_sent"),g.attackSent],[T("g_lines"),g.lines]]
                 : [[T("g_score"),g.score.toLocaleString()],[T("g_lines"),g.lines]])
    : g.mode==="speed"
    ? [[T("g_lines"),g.lines],[T("g_level"),g.level]]
    : [[T("g_score"),g.score.toLocaleString()],[T("g_level"),g.level]];
  const rows=items.length+1;
  const rx=h.r-L.cell*0.22;
  const keySz=Math.min(TS(0.40),h.w*0.165);
  const valSz=Math.min(TS(0.80),h.w*0.34);
  const drop=valSz*1.05;                            // key baseline to value baseline
  const pitch=Math.min(keySz+drop+L.cell*0.55, h.h/rows);
  const top=h.y+h.h-drop-pitch*(rows-1);            // h.y+h.h is the well's floor
  const key=(k,y)=>textFit(k,rx,y,keySz,INK.faint,"right",500,keySz*0.1,h.w);
  items.forEach(([k,v],i)=>{
    const y=top+pitch*i;
    key(k,y);
    textFit(String(v),rx,y+drop,valSz,INK.dim,"right",600,0,h.w);
  });
  const y=top+pitch*(rows-1);
  key(T(g.clock?"g_timeleft":"g_time"),y);
  clock(g,rx,y+drop,h.w,valSz);
}

function clock(g,rx,y,maxW,size){
  // a match clock is read the other way: what is left, not what has gone
  const el=g.clock ? g.left/1000 : ((g.endedAt||now())-g.startedAt)/1000;
  const face=String(Math.floor(el/60)).padStart(2,"0")+":"+String(Math.floor(el%60)).padStart(2,"0");
  const cs="."+String(Math.floor((el*100)%100)).padStart(2,"0");
  const wOf=(t,s)=>{ ctx.font="600 "+s+"px "+CANVAS_FONT; return ctx.measureText(t).width; };
  let big=size, small=big*0.62;
  for(let i=0;i<20 && wOf(face,big)+wOf(cs,small)>maxW && big>7;i++){ big*=0.93; small=big*0.62; }
  text(cs,rx,y,small,INK.dim,"right",600);
  text(face,rx-wOf(cs,small),y,big,INK.dim,"right",600);
}

/* Held still: the digit changes, nothing about it moves or fades. */
function drawCountdown(){
  const n=Math.ceil(COUNT);
  ctx.fillStyle="rgba(10,10,12,.62)";
  ctx.fillRect(L.bx,L.by,L.bw,L.bh);
  const sz=Math.min(L.cell*5,L.bw*0.8);
  text(String(n),L.bx+L.bw/2,L.by+L.bh/2+sz*0.36,sz,INK.fg,"center",600);
}

function drawBanners(){
  const cx=L.bx+L.bw/2;
  FX.banners.forEach((b,i)=>{
    const sz=b.big?TS(0.9):TS(0.68);
    const y=L.by+L.bh*0.30+i*sz*1.5+b.y;
    ctx.globalAlpha=clamp(b.life*1.6,0,1);
    textFit(b.txt,cx,y,sz,INK.fg,"center",600,sz*0.1,L.bw*0.94);
    ctx.globalAlpha=1;
  });
}

/* 5 · INPUT — one path for keyboard and touch */
const Input = {
  held:{left:false,right:false,softDrop:false},
  dir:0, dasTimer:0, arrTimer:0, soft:false,

  press(k){
    Sfx.unlock();
    if(!G || G.over) { if(k==="pause") UI.togglePause(); return; }
    if(COUNT>0) { if(k==="pause") UI.togglePause(); return; }
    switch(k){
      case "left":  this.held.left=true;  this.setDir(-1); break;
      case "right": this.held.right=true; this.setDir(1);  break;
      case "softDrop":
        this.held.softDrop=true; this.soft=true;
        if(!G.paused) G.softDrop();
        break;
      case "hardDrop": if(!G.paused){ G.hardDrop(); } break;
      case "rotR": if(!G.paused && G.rotate(1))  Sfx.rotate(); break;
      case "rotL": if(!G.paused && G.rotate(-1)) Sfx.rotate(); break;
      case "rot180": if(!G.paused){ G.rotate(1); G.rotate(1); Sfx.rotate(); } break;
      case "hold": if(!G.paused && G.holdPiece()) Sfx.hold(); break;
      case "pause": UI.togglePause(); break;
    }
  },
  release(k){
    switch(k){
      case "left":  this.held.left=false;  this.setDir(this.held.right?1:0); break;
      case "right": this.held.right=false; this.setDir(this.held.left?-1:0); break;
      case "softDrop": this.held.softDrop=false; this.soft=false; break;
    }
  },
  setDir(d){
    if(d===this.dir) return;
    this.dir=d; this.dasTimer=0; this.arrTimer=0;
    if(d!==0 && G && !G.paused && !G.over){ if(G.move(d,0)) Sfx.move(); }
  },
  tick(dt){
    if(!G||G.paused||G.over||this.dir===0) return;
    this.dasTimer+=dt;
    if(this.dasTimer<CFG.das) return;
    if(CFG.arr<=0){
      let moved=false; while(G.move(this.dir,0)) moved=true;
      if(moved) Sfx.move();
      return;
    }
    this.arrTimer+=dt;
    while(this.arrTimer>=CFG.arr){
      this.arrTimer-=CFG.arr;
      if(!G.move(this.dir,0)) break;
    }
  },
  reset(){ this.held={left:false,right:false,softDrop:false}; this.dir=0; this.soft=false; this.dasTimer=this.arrTimer=0; }
};

/* Every binding is a list of codes per action, so a key can be rebound without
   touching anything that reads it. The defaults are TETR.IO's. */
const ACTIONS=["left","right","softDrop","hardDrop","rotR","rotL","rot180","hold","pause"];
const KEYS_DEFAULT={
  left:["ArrowLeft"], right:["ArrowRight"], softDrop:["ArrowDown"], hardDrop:["Space"],
  rotR:["ArrowUp","KeyX"], rotL:["KeyZ","ControlLeft"], rot180:["KeyA"],
  hold:["KeyC","ShiftLeft"], pause:["Escape"]
};
/* Gamepad buttons in the standard mapping, laid out where TETRIS 99 puts them
   on a Switch pad: rotate right on the right and top faces, rotate left on the
   bottom and left, hold on any shoulder, drops on the d-pad. */
const PADS_DEFAULT={
  left:[14], right:[15], softDrop:[13], hardDrop:[12],
  rotR:[1,3], rotL:[0,2], rot180:[], hold:[4,5,6,7], pause:[9]
};
const fillBinds=(cur,def)=>{
  const out={};
  for(const a of ACTIONS) out[a]=(cur&&Array.isArray(cur[a]))?cur[a].slice():def[a].slice();
  return out;
};
CFG.keys=fillBinds(CFG.keys,KEYS_DEFAULT);
CFG.pads=fillBinds(CFG.pads,PADS_DEFAULT);

const keyAction = code => ACTIONS.find(a=>CFG.keys[a].includes(code));
const downKeys=new Set();
let BINDING=null;                        // set to a callback while something is listening for the next key
addEventListener("keydown",e=>{
  if(BINDING){ e.preventDefault(); BINDING(e.code); return; }
  const k=keyAction(e.code);
  if(!k) return;
  e.preventDefault();
  if(downKeys.has(e.code)) return;      // OS auto-repeat; we run our own DAS
  downKeys.add(e.code);
  Input.press(k);
},{passive:false});
addEventListener("keyup",e=>{
  const k=keyAction(e.code);
  if(!k) return;
  downKeys.delete(e.code);
  Input.release(k);
});
addEventListener("blur",()=>{ downKeys.clear(); Input.reset(); });

/* ---- gamepad ----------------------------------------------------------
   Polled once a frame: the API has no events for button state, and a pad that
   arrives mid-game should just start working. */
const Pad = {
  prev:{}, axis:0, axisDown:false, watching:null,
  poll(){
    if(!CFG.padOn || !navigator.getGamepads) return;
    let gp=null;
    for(const g of navigator.getGamepads()) if(g&&g.connected){ gp=g; break; }
    if(!gp){ this.prev={}; return; }
    if(this.watching){
