            r:cell*(0.045+Math.random()*0.065),   // fewer sparks per burst, so each one's bigger
            t:0, dur:1100+Math.random()*700,
            seed:Math.random()*1000,
            col
          });
        }
      }
    });
    /* The cap only ever gives up the oldest dust still hanging in the air —
       never this burst's own. rows[] runs top row first, so trimming a
       straight 500 off the front here would have thrown away exactly the
       rows spawned first: a tetris (1040 sparks) kept only its bottom two. */
    const spawned=FX.sparks.length-before;
    const cap=Math.max(SPARK_CAP,spawned);
    if(FX.sparks.length>cap) FX.sparks.splice(0,FX.sparks.length-cap);
  },
  step(dt){
    const f=dt/16.67;
    for(let i=FX.banners.length-1;i>=0;i--){
      const b=FX.banners[i]; b.life-=0.012*f; b.y-=0.4*f;
      if(b.life<=0) FX.banners.splice(i,1);
    }
    for(let i=FX.clearBanners.length-1;i>=0;i--){
      const b=FX.clearBanners[i]; b.t+=dt;
      if(b.t>=CLEAR_TXT_MS) FX.clearBanners.splice(i,1);
    }
    for(let i=FX.sparks.length-1;i>=0;i--){
      const p=FX.sparks[i]; p.t+=dt;
      if(p.t>=p.dur){ FX.sparks.splice(i,1); continue; }
      // Light drag and a steady wind out of the left, straight across — no
      // vertical component at all. The flutter is layered on top at draw
      // time (drawSparks), not summed in here: adding a sine to a position
      // every frame integrates it into real drift instead of a bounded
      // wobble.
      p.vx = p.vx*Math.pow(0.985,f) + L.cell*0.003*f;
      p.vy *= Math.pow(0.985,f);
      p.x += p.vx*f;
      p.y += p.vy*f;
    }
    if(FX.bob||FX.bobV){
      if(FX.bobV>0){
        FX.bobV-=FX.bob*BOB_STIFF*f;
        FX.bobV*=Math.pow(BOB_DAMP,f);
        if(FX.bobV<0) FX.bobV=0;        // stops the fall; it does not do the lifting
      }else{
        FX.bobV-=FX.bob*BOB_UP_STIFF*f;
        FX.bobV*=Math.pow(BOB_UP_DAMP,f);
      }
      FX.bob +=FX.bobV*f;
      if(Math.abs(FX.bob)<0.002 && Math.abs(FX.bobV)<0.002){ FX.bob=0; FX.bobV=0; }
    }
  }
};

/* the frame */
function render(g, opp){
  if(!L) resizeCanvas();
  if(!g){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    return;
  }
  const foes=g.mode==="versus"?Math.min(3,(opp||[]).length):0;
  if(TWIN!==foes){ TWIN=foes; computeLayout(); }
  PAL=palFor(g);
  ctx.setTransform(1,0,0,1,0,0);
  /* Cleared rather than filled: INK.bg is exactly the page's own --bg, so a
     transparent canvas over it looks identical with no custom background set,
     and lets one show through the space around the well, hold and next boxes
     when it is — the well itself still paints its own opaque fill below. */
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  /* Applied before anything is drawn, so hold, next and the stats ride down
     with the well — one object taking one hit, not a well jumping inside a
     still frame. */
  if(FX.bob) ctx.translate(0,FX.bob*L.cell);

  drawWell(g);
  drawSparks();
  if(g.mode==="versus") (opp||[]).slice(0,3).forEach((f,i)=>drawOpponent(f,i,g));
  drawGarbageMeter(g);
  drawSpeedBar(g);
  drawHold(g);
  drawClearText();
  drawNext(g);
  drawSide(g);
  if(COUNT>0 && g===G) drawCountdown();
  drawBanners();
  ctx.setTransform(1,0,0,1,0,0);
}

function drawWell(g){
  const {bx,by,bw,bh,cell}=L;

  ctx.fillStyle=rgba(INK.well,WELL_A); ctx.fillRect(bx,by,bw,bh);

  // cell grid, held at ~1.1 CSS px on every display
  if(CFG.grid){
    ctx.strokeStyle=INK.grid; ctx.lineWidth=1.1;
    ctx.beginPath();
    for(let x=1;x<COLS;x++){ ctx.moveTo(bx+x*cell,by); ctx.lineTo(bx+x*cell,by+bh); }
    for(let y=1;y<VIS_ROWS;y++){ ctx.moveTo(bx,by+y*cell); ctx.lineTo(bx+bw,by+y*cell); }
    ctx.stroke();
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(bx,by,bw,bh); ctx.clip();

  /* The live board already has the collapse in it — that happened the
     instant the lines cleared, so the next piece has real ground under it.
     What's drawn here for CLEAR_MS is g.clearing's frozen stack instead: the
     lines are gone, but nothing above them has moved yet, so the drop still
     plays out as a beat rather than an instant snap. A mirrored foe's board
     never shows this, since a clear never crosses the wire. */
  const stack = g.clearing ? g.clearing.board : g.board;

  for(let y=BUFFER;y<ROWS;y++){
    const sy=by+(y-BUFFER)*cell;
    for(let x=0;x<COLS;x++){
      const c=stack[y][x]; if(!c) continue;
      block(bx+x*cell,sy,cell,c);
    }
  }

  if(!g.over && !g.clearing && g.cur){
    if(CFG.ghost){
      const gy=g.ghostY();
      // the shape's own outline, placed: the well's clip takes off whatever
      // of it is still above the buffer
      if(gy!==g.cur.y) ghostPiece(g.cur.t,g.cur.r,g.cur.x,gy,bx,by,cell);
    }
    const lockP = g.grounded ? clamp(g.lockTimer/LOCK_MS,0,1) : 0;
    for(const [cx,cy] of g.cells(g.cur.x,g.cur.y,g.cur.r))
      if(cy>=BUFFER) block(bx+cx*cell,by+(cy-BUFFER)*cell,cell,g.cur.t,1-lockP*0.25);
  }

  ctx.restore();

  // A thin outline, open at the top: pieces enter the well rather than
  // crossing a line into it.
  wellEdge(bx,by,bw,bh,cell);

  if(g.over){
    ctx.fillStyle="rgba(10,10,12,.86)"; ctx.fillRect(bx,by,bw,bh);
    textFit(g.won?T("g_clear"):T("g_topout"),bx+bw/2,by+bh/2,TS(1.0),g.won?INK.fg:INK.danger,"center",600,TS(1.0)*0.14,bw*0.9);
  }
  if(g.paused && !g.over){
    ctx.fillStyle="rgba(10,10,12,.86)"; ctx.fillRect(bx,by,bw,bh);
    textFit(T("g_paused"),bx+bw/2,by+bh/2,TS(0.95),INK.fg,"center",600,TS(0.95)*0.16,bw*0.9);
  }
}

/* Additive blending is what makes a cluster of dust read as one glow rather
   than a handful of separate dots — where two sparks overlap, the light
   adds instead of one occluding the other. Each also twinkles on its own
   slow cycle rather than holding one brightness, which is most of what
   reads as "dust" instead of "dots". Unclipped: a spark drifting past the
   top or sides of the well is the point, not a bug to clip away. */
function drawSparks(){
  if(!FX.sparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const p of FX.sparks){
    const t=p.t, holdEnd=p.dur-SPARK_FADE_OUT;
    const env = t<holdEnd ? 1 : Math.max(0,(p.dur-t)/SPARK_FADE_OUT);
    if(env<=0) continue;
    const twinkle=0.65+0.35*Math.sin((t+p.seed)*0.009);
    const a=env*twinkle;
    // A bounded flutter, recomputed fresh each frame from t rather than
    // accumulated — it can never drift the way summing it into position did.
    const wob=Math.sin((t+p.seed)*0.006)*L.cell*0.08;
    const px=p.x, py=p.y+wob;
    const grad=ctx.createRadialGradient(px,py,0,px,py,p.r);
    grad.addColorStop(0,"#fffdf5");
    grad.addColorStop(0.45,p.col);
    grad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.globalAlpha=a;
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(px,py,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* Drawn last and outside the well's clip, because leaving the well is the
   whole point of it: the beam crosses the meter, the hold, the next queue and
   the stats on its way out, exactly as it crosses the frame in the reference.
   Three stacked passes make the bloom — a wide dim one, a middle one, then
   the core — which holds steadier than a canvas shadow and costs three fills
   a row rather than a blur. Additive, so where the beams of a quad meet they
   burn to white the way the reference frames do. */
/* The fuse: how long this well has left to produce a line. It drains as the
   clock runs down and comes straight back the moment one goes, so what you
   watch is the gap since your last clear, not the run. Red for the last
   third — the point where there is no longer time to build, only to dig. */
function drawSpeedBar(g){
  if(!g.limit) return;
  const b=L.fuse, p=clamp(g.fuse/g.limit,0,1);
  ctx.strokeStyle=INK.line; ctx.lineWidth=1;
  ctx.strokeRect(b.x-.5,b.y-.5,b.w+1,b.h+1);
  if(p<=0) return;
  ctx.fillStyle = p<=0.34 ? INK.danger : INK.dim;
  ctx.fillRect(b.x,b.y,b.w*p,b.h);
}

function drawGarbageMeter(g){
  if(g.mode!=="versus"||!g.attacks) return;
  const {gx,gy,gw,gh,cell}=L;
  const p=g.pendingCount();
  ctx.strokeStyle=INK.line; ctx.lineWidth=1;
  ctx.strokeRect(gx-.5,gy-.5,gw+1,gh+1);
  if(p<=0) return;
  const h=Math.min(gh,p*cell);
  ctx.fillStyle=INK.danger;
  ctx.fillRect(gx,gy+gh-h,gw,h);
  ctx.strokeStyle="rgba(10,10,12,.55)"; ctx.lineWidth=1; ctx.beginPath();
  for(let i=1;i<Math.min(p,20);i++){ const y=gy+gh-i*cell; ctx.moveTo(gx,y); ctx.lineTo(gx+gw,y); }
  ctx.stroke();
}

const pvTile=w=>w/4.4;

/* Three sides of a thin rectangle. The top is left open, so the well reads as
   a vessel that pieces fall into instead of a closed box. */
function wellEdge(x,y,w,h,cell){
  ctx.strokeStyle=INK.frame; ctx.lineWidth=Math.max(1.1,cell*0.055);
  ctx.beginPath();
  ctx.moveTo(x,y); ctx.lineTo(x,y+h); ctx.lineTo(x+w,y+h); ctx.lineTo(x+w,y);
  ctx.stroke();
}


/* Named where they sit, with nothing drawn around them: the well's edge is
   the only frame on the board. */
function caption(b,title){
  const sz=Math.min(TS(0.42),b.w*0.20);
  textFit(title,b.x+L.cell*0.30,b.y+L.cell*0.28+sz,sz,INK.faint,"left",600,sz*0.12,b.w-L.cell*0.6);
}

function drawHold(g){
  const b=L.hold;
  caption(b,T("g_hold"));
  if(g.hold){
    ctx.globalAlpha=g.holdUsed?0.28:1;
    preview(g.hold,b.x+b.w/2,b.y+L.cell*1.15+(b.h-L.cell*1.15)/2,L.tile);
    ctx.globalAlpha=1;
  }
}

// The same face and weight the countdown number is set in — just fit to a
// column instead of the whole well. Shrinks the way textFit() does.
const CLEAR_FONT=s=>`600 ${s}px ${CANVAS_FONT}`;
function clearFit(str,x,y,size,color,maxW){
  let s=size, txt=String(str).toUpperCase();
  const wOf=()=>{ ctx.font=CLEAR_FONT(s); return ctx.measureText(txt).width; };
  for(let i=0;i<40 && wOf()>maxW && s>6.5;i++) s-=Math.max(0.4,s*0.07);
  ctx.font=CLEAR_FONT(s);
  ctx.fillStyle=color; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  ctx.fillText(txt,x,y);
  return s;
}

/* Lower in the hold column, in the gap between the hold box and the stats
   block below it — clear of both, and clear of the well beside it, since
   clearFit never draws past maxW. A line clear used to write across the
   board a new piece was about to fall through; this is the closest a column
   that never moves gets to that. */
function drawClearText(){
  if(!FX.clearBanners.length) return;
  const b=L.hold, cx=b.x+b.w/2, maxW=b.w*0.94;
  let y=L.by+L.bh*0.48-L.cell*2;
  for(const banner of FX.clearBanners){
    const t=banner.t;
    const a = t<CLEAR_TXT_IN ? t/CLEAR_TXT_IN
            : t<CLEAR_TXT_IN+CLEAR_TXT_HOLD ? 1
            : Math.max(0,1-(t-CLEAR_TXT_IN-CLEAR_TXT_HOLD)/CLEAR_TXT_OUT);
    if(a<=0) continue;
    const sz=banner.big?TS(1.1):TS(0.85);
    ctx.globalAlpha=a;
    const used=clearFit(banner.txt,cx,y,sz,INK.fg,maxW);
    ctx.globalAlpha=1;
    y+=used*1.7;
  }
}

function drawNext(g){
  const b=L.next;
  caption(b,T("g_next"));
  const top=b.y+L.cell*1.2;
  g.bag.peek(5).forEach((p,i)=>{
    ctx.globalAlpha=i===0?1:0.5;
    preview(p,b.x+b.w/2,top+L.step*(i+0.5),i===0?L.ntile:L.ntile*0.84);
    ctx.globalAlpha=1;
  });
}

function drawOpponent(opp,i,g){
  const b=L.opps&&L.opps[i];
  if(!b) return;
  const cell=b.w/COLS;
  ctx.fillStyle=rgba(INK.well,WELL_A); ctx.fillRect(b.x,b.y,b.w,b.h);
  if(CFG.grid && cell>5){
    ctx.strokeStyle=INK.grid; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=1;x<COLS;x++){ ctx.moveTo(b.x+x*cell,b.y); ctx.lineTo(b.x+x*cell,b.y+b.h); }
    for(let y=1;y<VIS_ROWS;y++){ ctx.moveTo(b.x,b.y+y*cell); ctx.lineTo(b.x+b.w,b.y+y*cell); }
    ctx.stroke();
  }

  if(opp&&opp.board){
    for(let y=0;y<VIS_ROWS;y++) for(let x=0;x<COLS;x++){
      const c=opp.board[y*COLS+x];
      if(!c||c===".") continue;
      block(b.x+x*cell,b.y+y*cell,cell,c.toUpperCase(),c===c.toLowerCase()?0.85:1);
    }
  }

  wellEdge(b.x,b.y,b.w,b.h,cell);

  const nm=((opp&&opp.name)||T("opponent")).slice(0,12);
  const sz=Math.min(TS(0.42),b.w*0.115);
  /* Under the score rule the standing is the score, so it rides on the name
     line — there is no garbage meter to read it off instead. */
  const race=!!(g&&g.clock);
  textFit(nm,b.x,b.y-sz*0.45,sz,INK.faint,"left",600,sz*0.1,b.w*(race?0.56:1));
  if(race) textFit(((opp&&opp.score)|0).toLocaleString(),b.x+b.w,b.y-sz*0.45,sz,INK.dim,"right",600,0,b.w*0.42);

  if(opp&&opp.dead){
    ctx.fillStyle="rgba(10,10,12,.86)"; ctx.fillRect(b.x,b.y,b.w,b.h);
    textFit(T(race?"g_done":"g_ko"),b.x+b.w/2,b.y+b.h/2,Math.min(TS(1.0),b.w*0.30),race?INK.faint:INK.danger,"center",600,0,b.w*0.9);
  }
}

/* The stats read up from the floor of the board: the last figure sits on the
   well's bottom rule, and however many rows a mode has, they stack above it. */
function drawSide(g){
  const h=L.hud;
  const items = g.mode==="sprint"
    ? [[T("g_left"),Math.max(0,40-g.lines)+"/40"]]
    : g.mode==="versus"
    ? (g.attacks ? [[T("g_sent"),g.attackSent],[T("g_lines"),g.lines]]
                 : [[T("g_score"),g.score.toLocaleString()],[T("g_lines"),g.lines]])
    : g.mode==="speed"
    ? [[T("g_lines"),g.lines],[T("g_level"),g.level]]
    : [[T("g_score"),g.score.toLocaleString()],[T("g_level"),g.level]];
  const rows=items.length+1;
  const rx=h.r-L.cell*0.22;
  const keySz=Math.min(TS(0.40),h.w*0.165);
  const valSz=Math.min(TS(0.80),h.w*0.34);
  const drop=valSz*1.05;                            // key baseline to value baseline
  const pitch=Math.min(keySz+drop+L.cell*0.55, h.h/rows);
  const top=h.y+h.h-drop-pitch*(rows-1);            // h.y+h.h is the well's floor
  const key=(k,y)=>textFit(k,rx,y,keySz,INK.faint,"right",500,keySz*0.1,h.w);
  items.forEach(([k,v],i)=>{
    const y=top+pitch*i;
    key(k,y);
    textFit(String(v),rx,y+drop,valSz,INK.dim,"right",600,0,h.w);
  });
  const y=top+pitch*(rows-1);
  key(T(g.clock?"g_timeleft":"g_time"),y);
  clock(g,rx,y+drop,h.w,valSz);
}

function clock(g,rx,y,maxW,size){
  // a match clock is read the other way: what is left, not what has gone
  const el=g.clock ? g.left/1000 : ((g.endedAt||now())-g.startedAt)/1000;
  const face=String(Math.floor(el/60)).padStart(2,"0")+":"+String(Math.floor(el%60)).padStart(2,"0");
  const cs="."+String(Math.floor((el*100)%100)).padStart(2,"0");
  const wOf=(t,s)=>{ ctx.font="600 "+s+"px "+CANVAS_FONT; return ctx.measureText(t).width; };
  let big=size, small=big*0.62;
  for(let i=0;i<20 && wOf(face,big)+wOf(cs,small)>maxW && big>7;i++){ big*=0.93; small=big*0.62; }
  text(cs,rx,y,small,INK.dim,"right",600);
  text(face,rx-wOf(cs,small),y,big,INK.dim,"right",600);
}

/* Held still: the digit changes, nothing about it moves or fades. */
function drawCountdown(){
  const n=Math.ceil(COUNT);
  ctx.fillStyle="rgba(10,10,12,.62)";
  ctx.fillRect(L.bx,L.by,L.bw,L.bh);
  const sz=Math.min(L.cell*5,L.bw*0.8);
  text(String(n),L.bx+L.bw/2,L.by+L.bh/2+sz*0.36,sz,INK.fg,"center",600);
}

function drawBanners(){
  const cx=L.bx+L.bw/2;
  FX.banners.forEach((b,i)=>{
    const sz=b.big?TS(0.9):TS(0.68);
    const y=L.by+L.bh*0.30+i*sz*1.5+b.y;
    ctx.globalAlpha=clamp(b.life*1.6,0,1);
    textFit(b.txt,cx,y,sz,INK.fg,"center",600,sz*0.1,L.bw*0.94);
    ctx.globalAlpha=1;
  });
}

/* 5 · INPUT — one path for keyboard and touch */
const Input = {
  held:{left:false,right:false,softDrop:false},
  dir:0, dasTimer:0, arrTimer:0, soft:false,

  press(k){
    Sfx.unlock();
    if(!G || G.over) { if(k==="pause") UI.togglePause(); return; }
    if(COUNT>0) { if(k==="pause") UI.togglePause(); return; }
    switch(k){
      case "left":  this.held.left=true;  this.setDir(-1); break;
      case "right": this.held.right=true; this.setDir(1);  break;
      case "softDrop":
        this.held.softDrop=true; this.soft=true;
        if(!G.paused) G.softDrop();
        break;
      case "hardDrop": if(!G.paused){ G.hardDrop(); } break;
      case "rotR": if(!G.paused && G.rotate(1))  Sfx.rotate(); break;
      case "rotL": if(!G.paused && G.rotate(-1)) Sfx.rotate(); break;
      case "rot180": if(!G.paused){ G.rotate(1); G.rotate(1); Sfx.rotate(); } break;
      case "hold": if(!G.paused && G.holdPiece()) Sfx.hold(); break;
      case "pause": UI.togglePause(); break;
    }
  },
  release(k){
    switch(k){
      case "left":  this.held.left=false;  this.setDir(this.held.right?1:0); break;
      case "right": this.held.right=false; this.setDir(this.held.left?-1:0); break;
      case "softDrop": this.held.softDrop=false; this.soft=false; break;
    }
  },
  setDir(d){
    if(d===this.dir) return;
    this.dir=d; this.dasTimer=0; this.arrTimer=0;
    if(d!==0 && G && !G.paused && !G.over){ if(G.move(d,0)) Sfx.move(); }
  },
  tick(dt){
    if(!G||G.paused||G.over||this.dir===0) return;
    this.dasTimer+=dt;
    if(this.dasTimer<CFG.das) return;
    if(CFG.arr<=0){
      let moved=false; while(G.move(this.dir,0)) moved=true;
      if(moved) Sfx.move();
      return;
    }
    this.arrTimer+=dt;
    while(this.arrTimer>=CFG.arr){
      this.arrTimer-=CFG.arr;
      if(!G.move(this.dir,0)) break;
    }
  },
  reset(){ this.held={left:false,right:false,softDrop:false}; this.dir=0; this.soft=false; this.dasTimer=this.arrTimer=0; }
};

/* Every binding is a list of codes per action, so a key can be rebound without
   touching anything that reads it. The defaults are TETR.IO's. */
const ACTIONS=["left","right","softDrop","hardDrop","rotR","rotL","rot180","hold","pause"];
const KEYS_DEFAULT={
  left:["ArrowLeft"], right:["ArrowRight"], softDrop:["ArrowDown"], hardDrop:["Space"],
  rotR:["ArrowUp","KeyX"], rotL:["KeyZ","ControlLeft"], rot180:["KeyA"],
  hold:["KeyC","ShiftLeft"], pause:["Escape"]
};
/* Gamepad buttons in the standard mapping, laid out where TETRIS 99 puts them
   on a Switch pad: rotate right on the right and top faces, rotate left on the
   bottom and left, hold on any shoulder, drops on the d-pad. */
const PADS_DEFAULT={
  left:[14], right:[15], softDrop:[13], hardDrop:[12],
  rotR:[1,3], rotL:[0,2], rot180:[], hold:[4,5,6,7], pause:[9]
};
const fillBinds=(cur,def)=>{
  const out={};
  for(const a of ACTIONS) out[a]=(cur&&Array.isArray(cur[a]))?cur[a].slice():def[a].slice();
  return out;
};
CFG.keys=fillBinds(CFG.keys,KEYS_DEFAULT);
CFG.pads=fillBinds(CFG.pads,PADS_DEFAULT);

const keyAction = code => ACTIONS.find(a=>CFG.keys[a].includes(code));
const downKeys=new Set();
let BINDING=null;                        // set while the settings screen listens
addEventListener("keydown",e=>{
  if(BINDING){ e.preventDefault(); BINDING(e.code); return; }
  const k=keyAction(e.code);
  if(!k) return;
  e.preventDefault();
  if(downKeys.has(e.code)) return;      // OS auto-repeat; we run our own DAS
  downKeys.add(e.code);
  Input.press(k);
},{passive:false});
addEventListener("keyup",e=>{
  const k=keyAction(e.code);
  if(!k) return;
  downKeys.delete(e.code);
  Input.release(k);
});
addEventListener("blur",()=>{ downKeys.clear(); Input.reset(); });

/* ---- gamepad ----------------------------------------------------------
   Polled once a frame: the API has no events for button state, and a pad that
   arrives mid-game should just start working. */
const Pad = {
  prev:{}, axis:0, axisDown:false, watching:null,
  poll(){
    if(!CFG.padOn || !navigator.getGamepads) return;
    let gp=null;
    for(const g of navigator.getGamepads()) if(g&&g.connected){ gp=g; break; }
    if(!gp){ this.prev={}; return; }
    if(this.watching){
      for(let i=0;i<gp.buttons.length;i++) if(gp.buttons[i].pressed && !this.prev[i]){ this.watching(i); break; }
    }
    for(const a of ACTIONS){
      const on=!this.watching && CFG.pads[a].some(i=>gp.buttons[i]&&gp.buttons[i].pressed);
      if(on && !this.prev["a:"+a]) Input.press(a);
      else if(!on && this.prev["a:"+a]) Input.release(a);
      this.prev["a:"+a]=on;
    }
    for(let i=0;i<gp.buttons.length;i++) this.prev[i]=gp.buttons[i].pressed;
    // left stick doubles for the d-pad
    const x=gp.axes[0]||0, y=gp.axes[1]||0, dz=0.55;
    const dir=x<-dz?-1:x>dz?1:0;
    if(dir!==this.axis){
      if(this.axis===-1) Input.release("left"); else if(this.axis===1) Input.release("right");
      if(dir===-1) Input.press("left"); else if(dir===1) Input.press("right");
      this.axis=dir;
    }
    const down=y>dz;
    if(down!==this.axisDown){ down?Input.press("softDrop"):Input.release("softDrop"); this.axisDown=down; }
  }
};

/* ---- gestures on the screen ------------------------------------------
   The phone-Tetris scheme: drag sideways to move a cell at a time, drag down to
   soft drop, flick down to hard drop, drag up to hold, tap to rotate.
   Distances are in cells so the feel does not change with screen size.

   Every gesture ends in Input.press rather than calling the game directly:
   that one door is where the countdown and the finished run are locked, and a
   hold that reached past it was the one action a player could take before the
   match had started.                                                        */
const Swipe = {
  id:null, x0:0, y0:0, t0:0, lx:0, ly:0, moved:0, dropped:false, swapped:false, hold:false,
  cell(){ return (L&&L.cell)?L.cell:24; },
  inHold(x,y){
    const b=L&&L.hold; if(!b) return false;
    const r=$("#cv").getBoundingClientRect();
    const px=x-r.left, py=y-r.top;
    return px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h;
  },
  down(e){
    if(CFG.touch!=="swipe" || !G || G.over || G.paused) return;
    if(this.id!==null) return;
    this.id=e.pointerId;
    this.x0=this.lx=e.clientX; this.y0=this.ly=e.clientY; this.t0=now();
    this.moved=0; this.dropped=false; this.swapped=false;
    this.hold=this.inHold(e.clientX,e.clientY);
  },
  move(e){
    if(this.id!==e.pointerId || this.dropped) return;
    const c=this.cell();
    const stepX=c*CFG.swMove/100, stepY=c*CFG.swDrop/100, flick=CFG.swFlick/100;
    let dx=e.clientX-this.lx;
    while(Math.abs(dx)>=stepX){
      const step=dx>0?1:-1;
      Input.press(step>0?"right":"left"); Input.release(step>0?"right":"left");
      this.lx+=step*stepX; dx=e.clientX-this.lx;
      this.moved++; this.hold=false;
    }
    /* Up is hold. Nothing else is drawn from an upward drag — the well only
       ever goes down — so distance alone decides it and there is no need to
       be quick about it, unlike the flick below. Once per gesture: the piece
       swaps when you get there, not once per cell on the way. */
    const up=this.y0-e.clientY;
    if(!this.swapped && up>c*1.5 && Math.abs(e.clientX-this.x0)<up*0.9){
      Input.press("hold");
      this.swapped=true; this.moved++; this.hold=false;
      return;
    }

    const dy=e.clientY-this.y0, dt=Math.max(1,now()-this.t0);
    // a flick: far and fast, and clearly downward
    if(dy>c*1.6 && dy/dt>flick && Math.abs(e.clientX-this.x0)<dy*0.8){
      Input.press("hardDrop");
      this.dropped=true; this.moved++; this.hold=false;
      return;
    }
    let vy=e.clientY-this.ly;
    while(vy>=stepY){
      Input.press("softDrop"); Input.release("softDrop");
      this.ly+=stepY; vy=e.clientY-this.ly;
      this.moved++; this.hold=false;
    }
  },
  up(e){
    if(this.id!==e.pointerId) return;
    const quick=now()-this.t0<260, still=this.moved===0;
    if(!this.dropped && quick && still){
      if(this.hold) Input.press("hold");
      else Input.press("rotR");
    }
    this.id=null; this.hold=false; this.swapped=false;
  }
};
{
  const sc=$("#screen");
  sc.addEventListener("pointerdown",e=>{ Swipe.down(e); },{passive:true});
  sc.addEventListener("pointermove",e=>{ Swipe.move(e); },{passive:true});
  sc.addEventListener("pointerup",e=>Swipe.up(e));
  sc.addEventListener("pointercancel",e=>{ Swipe.id=null; });
}

// ---- touch / pointer ----
// Pointer capture per button keeps multitouch working.
$$("[data-k]").forEach(el=>{
  const k=el.dataset.k;
  const down=e=>{
    e.preventDefault();
    el.classList.add("hit");
    if(e.pointerId!=null && el.setPointerCapture) { try{el.setPointerCapture(e.pointerId);}catch(_){} }
    if(navigator.vibrate) navigator.vibrate(8);
    Input.press(k);
  };
  const up=e=>{ el.classList.remove("hit"); Input.release(k); };
  el.addEventListener("pointerdown",down,{passive:false});
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("lostpointercapture",up);
  el.addEventListener("contextmenu",e=>e.preventDefault());
});

/* 6 · GAME SHELL — loop, countdown, event drain */
let G=null;
let FOES=[];              // the other wells, mirrored from what the room reports
let COUNT=0, countEnd=0;
/* Built from the room's own player records rather than kept alongside them,
   so there is one account of who is in and how they are doing. */
/* Who has been asked into this room, so the button can say so. Cleared with
   the room, since the answer to an invite is joining it. */
const ASKED=new Set();
const READY_P2P={me:false,peer:false};
const WINS_P2P ={me:0,peer:0};

function mirrorFoes(others){
  FOES=others.map(p=>{
    const was=FOES.find(f=>f.pid===p.pid);
    const f=was||{pid:p.pid,board:null,sent:0,score:0};
    f.name=p.n; f.dead=p.d; f.wins=p.w;
    if(p.b){ f.board=Grid.dec(p.b.d||""); f.sent=p.b.s|0; f.score=p.b.p|0; if(p.b.o) f.dead=true; }
    return f;
  });
}

/* A versus match is over when one player is left standing. Every client can
   see the whole room, so each works it out from the same state rather than
   waiting to be told.

   Counted against the round's own roster, not against who happens to be in the
   room: someone who joined between rounds is not a survivor keeping the match
   alive, and someone who quit mid-round does not take the win away from the
   player who outlasted them. */
function checkLastStanding(){
  // no garbage crosses under the score rule, so nobody is ever last standing
  if(!Room.on||!G||G.over||G.mode!=="versus"||!G.attacks) return;
  if(Room.roster.size<2) return;      // a round only this client answered is not a win
  const alive=Room.alive();
  if(alive.length===1 && alive[0].pid===PID){
    Room.set("w",(Room.me()||{w:0}).w+1);
    G.win();
  }
}

/* Out of the round, now, and said out loud.

   A tab that is hidden or suspended has its rAF and its timers throttled to a
   crawl: the well stops falling, the poll stops reading, and three other
   players are left waiting on somebody who is not there — nobody can be last
   standing while a frozen well counts as alive. Whatever notices calls this:
   the tab going away, or a poll coming back from a gap long enough that the
   room has already written this client off.

   The events are drained here rather than left to the loop, because the loop
   is the thing that is not running — and the one that matters is the write
   that tells the room. */
function dropOut(){
  if(!G || G.over || G.mode!=="versus") return;
  G.away=true;
  G.die();
  drainEvents();
}

/* A score match is not decided by the well that stops first — every one of
   them has to stop before the points mean anything, since a score read a tick
   before the last piece landed would call the wrong winner. So the result is
   held back until the room has gone quiet, and the wait is capped: a player
   who closed the tab must not hold the rest of the room on the screen. */
const TALLY_MS=4000;
function settleScore(){
  if(!G.doneAt) G.doneAt=now();
  if(FOES.some(f=>!f.dead) && now()-G.doneAt<TALLY_MS) return;
  G.settled=true;
  const best=FOES.reduce((m,f)=>Math.max(m,f.score|0),-1);
  const won=G.score>best;
  if(won) G.won=true;
  UI.tallied(won,G.score===best,best);
}

function startMatch(){
  if(G && G.mode==="versus" && !G.over) return;
  Net.lastB="";                       // a rematch starts from an empty well, not the last one sent
  if(Room.on){
    Room.set("d",false); Room.set("b",null); Room.set("rdy",false);
    /* The write is a round trip away, and the host decides whether to call a
       start from this same list on this same tick: leave it saying "ready" and
       it calls a second one. */
    const m=Room.me(); if(m) m.rdy=false;
  }
  UI.renderRoom();
  UI.closeAll();
  afterScreen(()=>startGame("versus"));
}
let rafId=0, lastT=0, sendAcc=0;

function startGame(mode){
  PAL_PICK=rnd(NES_PALETTES.length);     // sprint and versus keep this one throughout
  G=new Game(mode);
  COUNT=3; countEnd=now()+3000;
  if(mode==="versus"){
    Room.starting=0;                     // the call has become a well; the room may call the next one
    FOES.forEach(f=>{ f.board=null; f.sent=0; f.score=0; f.dead=false; });
  }
  else FOES=[];
  FX.banners.length=0; FX.clearBanners.length=0; FX.sparks.length=0; FX.bob=FX.bobV=0;
  Input.reset();
  UI.closeAll();
  document.body.classList.toggle("hot",mode==="versus");
  if(!rafId) loop(now());
}

function loop(t){
  rafId=requestAnimationFrame(loop);
  const dt=Math.min(64, t-lastT||16); lastT=t;

  if(G){
    if(COUNT>0 && !G.over){
      // Read off the clock, not off frames: a throttled tab must not stretch it.
      if(G.paused) countEnd=now()+COUNT*1000;
      else{
        const was=Math.ceil(COUNT);
        COUNT=Math.max(0,(countEnd-now())/1000);
        G.startedAt=now();
        if(COUNT<=0){ Sfx.go(); FX.banner(T("g_go"),"big"); }
        else if(Math.ceil(COUNT)!==was) Sfx.count();
      }
    }else{
      Input.tick(dt);
      G.tick(dt,{soft:Input.soft});
    }
    drainEvents();
    if(G.rule==="score" && G.over && !G.settled) settleScore();
  }
  FX.step(dt);
  render(G,G?FOES:null);
  if(!G){ cancelAnimationFrame(rafId); rafId=0; return; }

  Pad.poll();

  if(G && G.mode==="versus" && Net.ready()){
    sendAcc+=dt;
    if(sendAcc>=(Net.mode==="room"?ROOM_MS:80)){
      sendAcc=0;
      Net.send({t:"b",d:G.snapshot(),s:G.attackSent,p:G.score,o:G.over});
    }
  }
}

function drainEvents(){
  FX.clearGen++;
  while(G.events.length){
    const ev=G.events.shift();
    switch(ev.e){
      case "text": FX.clearText(ev.text,ev.kind==="big"||ev.kind==="pc"); break;
      case "clear": FX.bump(ev.n); FX.burst(ev.rows,ev.cells,ev.n); break;
      case "drop": FX.thud(); break;
      case "attack":
        if(G.mode==="versus" && Net.ready()){
          /* One opponent at a time, drawn fresh for every attack: split four
             ways a clear stops meaning anything, and aimed by hand it stops
             being Tetris. Whoever it lands on is told; the rest see it in the
             board that comes back. */
          if(Net.mode==="room"){
            const live=Room.alive().filter(p=>p.pid!==PID);
            if(live.length){
              const t=live[rnd(live.length)];
              Room.attack(t.pid,ev.lines);
              FX.banner(T("b_sendto",{n:ev.lines,who:t.n}),"combo");
            }
          }else{
            Net.send({t:"a",n:ev.lines});
            FX.banner(T("b_send",{n:ev.lines}),"combo");
          }
        }
        break;
      case "dead":
        if(Net.mode==="room"){ if(Room.on) Room.set("d",true); }
        else if(Net.ready()) Net.send({t:"d"});
        // under the score rule a stopped well is not a loss yet, only a total
        if(G.rule==="score") UI.matchPending(); else UI.gameOver(false);
        break;
      case "win": UI.gameOver(true); break;
    }
  }
}

/* 7 · PEER-TO-PEER — codes swapped by hand, then a DataChannel. No server. */

// STUN for the public address; the link itself is always direct.
function rtcConfig(){
  return {
    iceServers:[
      {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302",
             "stun:stun2.l.google.com:19302","stun:stun.cloudflare.com:3478"]}
    ],
    iceCandidatePoolSize:2
  };
}

/* A session description is almost all boilerplate the two ends already agree
   on. Only the ufrag, password, fingerprint, role and candidates say anything;
   the rest is rebuilt from a template on arrival. That takes the code from
   ~920 characters to ~130 — short enough to be a picture rather than a paste. */
const FPALG=["sha-256","sha-1","sha-384","sha-512"], FPLEN=[32,20,48,64];
const SETUP=["actpass","active","passive","holdconn"];
const CTYPE=["host","srflx","prflx","relay"], TCPT=["active","passive","so"];
const MDNS=/^([0-9a-f]{8})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{12})\.local$/i;

function ip4(s){ const p=String(s).split("."); return p.length===4&&p.every(o=>/^\d+$/.test(o)&&+o<256)?p.map(Number):null; }
function ip6(s){
  if(s.indexOf(":")<0) return null;
  const half=s.split("::");
  if(half.length>2) return null;
  const head=half[0]?half[0].split(":"):[], tail=half[1]?half[1].split(":"):[];
  const fill=8-head.length-tail.length;
  if(half.length===1?head.length!==8:fill<0) return null;
  const gs=half.length===2?head.concat(new Array(fill).fill("0"),tail):head, out=[];
  for(const g of gs){
    if(!/^[0-9a-fA-F]{1,4}$/.test(g)) return null;
    const v=parseInt(g,16); out.push(v>>8,v&255);
  }
  return out.length===16?out:null;
}
function ip6str(b){
  const g=[];
  for(let i=0;i<16;i+=2) g.push(((b[i]<<8)|b[i+1]).toString(16));
  let bi=-1,bl=0,i=0;
  while(i<8){ if(g[i]==="0"){ let j=i; while(j<8&&g[j]==="0") j++; if(j-i>bl){bl=j-i;bi=i;} i=j; } else i++; }
  return bl>1 ? g.slice(0,bi).join(":")+"::"+g.slice(bi+bl).join(":") : g.join(":");
}

function parseSDP(sdp){
  const one=re=>{ const m=re.exec(sdp); return m?m[1]:null; };
  const fp=/^a=fingerprint:(\S+) (\S+)/m.exec(sdp);
  if(!fp) return null;
  const o={
    ufrag:one(/^a=ice-ufrag:(\S+)/m), pwd:one(/^a=ice-pwd:(\S+)/m),
    alg:FPALG.indexOf(fp[1].toLowerCase()), fp:fp[2].split(":").map(h=>parseInt(h,16)),
    setup:SETUP.indexOf(one(/^a=setup:(\S+)/m)), cands:[]
  };
  if(!o.ufrag||!o.pwd||o.alg<0||o.setup<0) return null;
  const re=/^a=candidate:(\S+) (\d+) (\S+) (\d+) (\S+) (\d+) typ (\S+)(.*)$/mg;
  let m;
  while((m=re.exec(sdp))){
    const type=CTYPE.indexOf(m[7]);
    if(m[2]!=="1"||type<0) continue;      /* only the RTP component is ever used */
    const rest=m[8]||"", ra=/ raddr (\S+) rport (\d+)/.exec(rest), tt=/ tcptype (\S+)/.exec(rest);
    o.cands.push({
      type, proto:/^tcp$/i.test(m[3])?1:0, tcptype:tt?Math.max(0,TCPT.indexOf(tt[1])):0,
      addr:m[5], port:+m[6], raddr:ra?ra[1]:null, rport:ra?+ra[2]:0
    });
  }
  return o;
}

function packDesc(kind,sdp,name,seed){
  const s=parseSDP(sdp);
  if(!s) return null;
  const b=[];
  const u8=v=>b.push(v&255), u16=v=>b.push((v>>8)&255,v&255);
  const str=t=>{ const u=unescape(encodeURIComponent(t||"")), n=Math.min(255,u.length);
                 u8(n); for(let i=0;i<n;i++) u8(u.charCodeAt(i)); };
  u8(kind|(s.alg<<2)|(s.setup<<4));
  if(!kind) b.push((seed>>>24)&255,(seed>>>16)&255,(seed>>>8)&255,seed&255);
  str(name); str(s.ufrag); str(s.pwd);
  for(const v of s.fp.slice(0,FPLEN[s.alg])) u8(v);
  const cands=s.cands.slice(0,15);
  u8(cands.length);
  for(const c of cands){
    const at=b.length;
    u8(0);                                /* patched once the address form is known */
    let form;
    const md=MDNS.exec(c.addr), v4=ip4(c.addr), v6=v4?null:ip6(c.addr);
    if(md){ const h=md[1]+md[2]+md[3]+md[4]+md[5];
            for(let i=0;i<32;i+=2) u8(parseInt(h.substr(i,2),16)); form=1; }
    else if(v4){ for(const v of v4) u8(v); form=0; }
    else if(v6){ for(const v of v6) u8(v); form=2; }
    else { str(c.addr); form=3; }
    u16(c.port);
    let f=c.type|(form<<2)|(c.proto<<4)|(c.tcptype<<5);
    const r4=c.raddr?ip4(c.raddr):null;
    if(r4){ f|=128; for(const v of r4) u8(v); u16(c.rport); }
    b[at]=f;
  }
  return b;
}

function unpackDesc(b){
  let p=0;
  const u8=()=>b[p++], u16=()=>(u8()<<8)|u8();
  const bytes=n=>{ const o=[]; for(let i=0;i<n;i++) o.push(b[p++]); return o; };
  const str=()=>{ const n=u8(); let s="";
                  for(let i=0;i<n;i++) s+=String.fromCharCode(b[p++]);
                  try{ return decodeURIComponent(escape(s)); }catch(e){ return s; } };
  const h=u8(), kind=h&3, alg=(h>>2)&3, setup=(h>>4)&3;
  if(kind>1) return null;
  const seed=kind?0:((u8()<<24)|(u8()<<16)|(u8()<<8)|u8())>>>0;
  const name=str(), ufrag=str(), pwd=str();
  const fp=bytes(FPLEN[alg]).map(v=>v.toString(16).padStart(2,"0").toUpperCase()).join(":");
  const n=u8(), lines=[];
  for(let i=0;i<n;i++){
    if(p>=b.length) return null;
    const f=u8(), type=f&3, form=(f>>2)&3, proto=(f>>4)&1, tcptype=(f>>5)&3;
    const addr=form===0?bytes(4).join(".")
             :form===1?(()=>{ const x=bytes(16).map(v=>v.toString(16).padStart(2,"0")).join("");
                              return `${x.slice(0,8)}-${x.slice(8,12)}-${x.slice(12,16)}-${x.slice(16,20)}-${x.slice(20)}.local`; })()
             :form===2?ip6str(bytes(16)):str();
    const port=u16();
    let extra="";
    if(f&128){ const ra=bytes(4).join("."), rp=u16(); extra=` raddr ${ra} rport ${rp}`; }
    if(proto) extra+=` tcptype ${TCPT[tcptype]||"active"}`;
    /* foundation and priority are local bookkeeping — any consistent value does */
    const pri=(type===3?41885439:type===0?2113937151:1677729535)-i;
    lines.push(`a=candidate:${i+1} 1 ${proto?"tcp":"udp"} ${pri} ${addr} ${port} typ ${CTYPE[type]}${extra}`);
  }
  /* Every byte is accounted for, and ICE needs a real ufrag and password —
     without this a buffer of zeroes reads as a plausible description and only
     falls over later, inside the browser. */
  if(p!==b.length||ufrag.length<4||pwd.length<8) return null;
  return {
    k:kind?"a":"o", n:name, s:seed,
    d:{type:kind?"answer":"offer", sdp:[
      "v=0","o=- 1 2 IN IP4 127.0.0.1","s=-","t=0 0","a=group:BUNDLE 0",
      "a=extmap-allow-mixed","a=msid-semantic: WMS",
      "m=application 9 UDP/DTLS/SCTP webrtc-datachannel","c=IN IP4 0.0.0.0",
      ...lines,
      `a=ice-ufrag:${ufrag}`,`a=ice-pwd:${pwd}`,"a=ice-options:trickle",
      `a=fingerprint:${FPALG[alg]} ${fp}`,`a=setup:${SETUP[setup]}`,
      "a=mid:0","a=sctp-port:5000","a=max-message-size:262144",""
    ].join("\r\n")}
  };
}

/* URL-safe base64: codes get pasted through chat apps, and travel as QR bytes. */
function b64enc(bytes){
  let s="";
  for(const v of bytes) s+=String.fromCharCode(v);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64dec(s){
  s=s.replace(/[^A-Za-z0-9+/\-_=]/g,"").replace(/-/g,"+").replace(/_/g,"/").replace(/=+$/,"");
  while(s.length%4) s+="=";
  const t=atob(s), o=new Uint8Array(t.length);
  for(let i=0;i<t.length;i++) o[i]=t.charCodeAt(i);
  return o;
}
function encodeBlob(obj){
  const packed=packDesc(obj.k==="o"?0:1,obj.d.sdp,obj.n,obj.s>>>0);
  if(!packed) throw new Error(T("e_badcode"));
  return "TFX2"+b64enc(packed);
}
function decodeBlob(str){
  const s=String(str).trim();
  const i=s.indexOf("TFX2");
  if(i<0) throw new Error(T("e_badcode"));
  const out=unpackDesc(b64dec(s.slice(i+4)));
  if(!out) throw new Error(T("e_badcode"));
  return out;
}

function waitIceGatheringComplete(pc){
  return new Promise(resolve=>{
    if(pc.iceGatheringState==="complete"){ resolve(); return; }
    const check=()=>{
      if(pc.iceGatheringState==="complete"){
        pc.removeEventListener("icegatheringstatechange",check);
        clearTimeout(to); resolve();
      }
    };
    const to=setTimeout(resolve,6000);
    pc.addEventListener("icegatheringstatechange",check);
  });
}

/* Firebase Realtime Database over its REST API — no SDK, no script tag. A room
   holds the two codes for as long as the handshake takes and is deleted after.
   The game itself never touches it: once the peers are linked it is only
   WebRTC, exactly as with a hand-swapped code. */
const FB = {
  base(){ return (CFG.fbUrl||"").trim().replace(/\/+$/,""); },
  on(){ return /^https?:\/\/.+/i.test(this.base()); },
  url(path,q){ return this.base()+path+".json"+(q||""); },
  async req(path,opt,q){
    let r;
    try{ r=await fetch(this.url(path,q),opt); }
    catch(e){ throw new Error(T("e_fbnet")); }                     // DNS, CORS, offline
    if(!r.ok) throw new Error(T(r.status===401||r.status===403?"e_fbauth":"e_fbnet"));
    const t=await r.text();
    return t&&t!=="null" ? JSON.parse(t) : null;
  },
  get(path){ return this.req(path,{cache:"no-store"}); },
  keys(path){ return this.req(path,{cache:"no-store"},"?shallow=true"); },   // names only, no payload
  put(path,val){ return this.req(path,{method:"PUT",body:JSON.stringify(val)}); },
  /* Merges into a node instead of replacing it, which matters wherever two
     writers share one: a heartbeat that PUT the whole record would take an
     invite written alongside it down with every beat. */
  patch(path,val){ return this.req(path,{method:"PATCH",body:JSON.stringify(val)}); },
  /* keepalive because most of these are the goodbye: a plain fetch started
     from beforeunload is cancelled with the page, and the seat it was there to
     give up sits in the room until it goes stale. */
  del(path){ return this.req(path,{method:"DELETE",keepalive:true}).catch(()=>null); },
  /* Polled rather than streamed: EventSource cannot be aborted mid-flight on
     every browser, and one small GET a second is well inside the free tier. */
  watch(path,ms,cb){
    let stop=false;
    (async function loop(){
      while(!stop){
        try{ const v=await FB.get(path); if(v!=null && !stop){ stop=true; cb(null,v); return; } }
        catch(e){ if(!stop){ stop=true; cb(e); return; } }
        await new Promise(r=>setTimeout(r,ms));
      }
    })();
    return ()=>{ stop=true; };
  }
};

const ROOM_STALE=120000;          // a room nobody claimed in two minutes is a ghost
const ROOM_ALPHA="ACDEFGHJKLMNPQRTUVWXYZ2346789";
const roomId = n => Array.from({length:n||6},()=>ROOM_ALPHA[rnd(ROOM_ALPHA.length)]).join("");

/* A well is 200 cells and most of them are empty, so runs are collapsed before
   it goes out: each cell followed by the length of its run when that run is
   longer than one. Cells are letters or ".", never digits, so the count can
   never be mistaken for a cell. Typically 200 chars become about 60.        */
const Grid = {
  enc(s){
    let out="";
    for(let i=0;i<s.length;){
      let j=i;
      while(j<s.length && s[j]===s[i]) j++;
      out += s[i] + (j-i>1 ? j-i : "");
      i=j;
    }
    return out;
  },
  dec(s){
    if(!/\d/.test(s)) return s;          // already flat: a run-free well, or an older peer
    let out="";
    for(let i=0;i<s.length;){
      const c=s[i++];
      let n="";
      while(i<s.length && s[i]>="0" && s[i]<="9") n+=s[i++];
      out += c.repeat(n?+n:1);
    }
    return out;
  }
};

/* ---- the room ------------------------------------------------------------
   Up to four players, over the database. It is the only transport that goes
   past two: a hand-swapped WebRTC code is one link, and four players would be
   six of them, swapped by hand.

   Everything a player broadcasts is last-value state under its own branch —
   board, ready, wins, dead — because with three readers there is nobody who
   can safely delete a queued message once it has been read. The one thing
   that has to arrive rather than be noticed is garbage, so that one is
   addressed: the sender writes it into the *recipient's* branch, which makes
   the recipient the only reader and free to clear it. Chat is appended and
   left alone; the host trims it.

   One GET a tick fetches the whole room — four boards run-length encoded and
   a little chat — rather than one per player, which keeps the request count
   flat as the room fills.                                                  */
const ROOM_MS=220, ROOM_HB=2500, ROOM_GONE=11000, CHAT_KEEP=40, MAX_SEATS=4;
let PID="";                       // who this tab is, for as long as it is open

const Room = {
  id:null, on:false, host:false, timer:null, hb:null,
  players:[], chat:[], gseq:0, lastGo:0, seed:0,
  /* Who the round started with, as pid → the join stamp they held at the time.
     Taken locally when the start is seen rather than published, so it needs no
     agreement and no clock two machines have to share. It is a snapshot: a
     player who leaves mid-round stays in it, which is what lets the one left
     standing still be standing against somebody. */
  roster:new Map(),
  /* And who has fallen out of it since. A tab the phone froze stops beating,
     drops off the room's list, and comes back minutes later with its board
     where it left it — so falling out is remembered rather than re-read, and a
     round nobody could finish is not handed back the player who stalled it. */
  dropped:new Set(),
  starting:0,                     // a start called but not yet a well, on this clock
  lastPoll:0,                     // when a read last went out, on this clock

  path(){ return "/rooms/"+this.id; },
  mine(){ return this.path()+"/p/"+PID; },
  me(){ return this.players.find(p=>p.pid===PID)||null; },
  others(){ return this.players.filter(p=>p.pid!==PID); },
  /* In the round, rather than in the room. The join stamp has to match the one
     the roster took as well as the pid: a player who left and came back is a
     new arrival watching, not the one who was playing. */
  inRound(p){ return !this.lastGo || (this.roster.get(p.pid)===p.j && !this.dropped.has(p.pid)); },
  alive(){ return this.players.filter(p=>!p.d && this.inRound(p)); },

  async create(){
    if(!FB.on()) throw new Error(T("e_nofb"));
    PID=PID||roomId(8);
    const id=roomId(6);
    NET_RULE="attack";
    await FB.put("/rooms/"+id,{h:PID, t:Date.now(), r:NET_RULE});
    await FB.put("/rooms/"+id+"/p/"+PID,{n:CFG.name, j:Date.now(), t:Date.now(), w:0});
    await FB.put("/lobby/"+id,{n:CFG.name, t:Date.now(), c:1});
    this.begin(id,true,0);
    return id;
  },

  async join(id){
    if(!FB.on()) throw new Error(T("e_nofb"));
    PID=PID||roomId(8);
    const v=await FB.get("/rooms/"+id);
    if(!v) throw new Error(T("e_noroom"));
    /* Seats are the players still beating, not the records left behind: a tab
       that closed without saying so holds its branch until it goes stale, and
       counting those turns a room with one player in it away as full. */
    const gone=Date.now()-ROOM_GONE;
    const seated=Object.keys(v.p||{}).filter(k=>((v.p[k]||{}).t||0)>gone).length;
    if(seated>=MAX_SEATS) throw new Error(T("e_roomfull"));
    await FB.put("/rooms/"+id+"/p/"+PID,{n:CFG.name, j:Date.now(), t:Date.now(), w:0});
    /* The start is last-value state that is never taken down, so a room that
       has played once would hand its last one to everybody who walks in and
       drop them into a match they were not in. Arriving means having seen it. */
    this.begin(id,false,(v.go&&v.go.at)||0);
  },

  begin(id,host,lastGo){
    this.id=id; this.host=host; this.on=true;
    this.players=[]; this.chat=[]; this.gseq=0; this.lastGo=lastGo||0;
    this.roster=new Map(); this.dropped=new Set(); this.starting=0; this.lastPoll=now();
    Who.inRoom(id);
    this.beat();
    this.hb=setInterval(()=>this.beat(),ROOM_HB);
    this.poll();
  },

  stop(){
    if(!this.on && !this.id) return;
    const id=this.id, host=this.host;
    this.on=false;
    clearTimeout(this.timer); clearInterval(this.hb);
    this.timer=this.hb=null; this.id=null;
    this.players=[]; this.chat=[]; this.roster=new Map(); this.dropped=new Set();
    this.starting=0; this.lastPoll=0; ASKED.clear();
    if(id && FB.on()){
      // the host owns the room and takes it down with it
      if(host){ FB.del("/lobby/"+id); FB.del("/rooms/"+id); }
      else{ FB.del("/rooms/"+id+"/p/"+PID); FB.put("/lobby/"+id+"/t",Date.now()); }
    }
    Who.inRoom(null);
  },

  beat(){
    if(!this.on) return;
    FB.put(this.mine()+"/t",Date.now()).catch(()=>{});
    /* The host also keeps the room's own listing alive and current: without
       this a room in use would go stale out of the list after two minutes,
       and would advertise the one seat it was created with forever. */
    if(this.host) FB.patch("/lobby/"+this.id,{n:CFG.name, t:Date.now(), c:this.players.length||1}).catch(()=>{});
  },
  set(k,v){ if(this.on) FB.put(this.mine()+"/"+k,v).catch(()=>{}); },
  /* Merged, not replaced: the room node also carries the host and the go. */
  pushRule(){ if(this.on&&this.host) FB.patch(this.path(),{r:NET_RULE}).catch(()=>{}); },
  /* Addressed, and queued rather than last-value: two attacks in one tick
     must both land, and only the player they are aimed at reads them. The
     sender's own id is in the key because the count behind it is only its own:
     with three players aiming at one well, two first attacks would otherwise
     both be written to g/1 and one of them would never arrive. */
  attack(pid,n){ if(this.on) FB.put(this.path()+"/p/"+pid+"/g/"+PID+"_"+(++this.gseq),n).catch(()=>{}); },
  /* The clock names the line so the log reads in the order it was said, and the
     speaker is on the end of it: two people typing in the same millisecond
     would otherwise be one line, the slower write winning. */
  say(text){
    if(!this.on) return;
    const t=String(text).slice(0,120);
    if(!t.trim()) return;
    FB.put(this.path()+"/c/"+Date.now()+"-"+PID,{n:CFG.name,m:t}).catch(()=>{});
  },

  /* The host is the one that calls the start, so four clients cannot each
     decide a slightly different moment. */
  callStart(){
    if(!this.host||!this.on) return;
    const seed=((Math.random()*0xffffffff)>>>0)||1;
    this.starting=now();
    /* The rule travels with the seed rather than being read off the room: a
       client that has not polled since the host changed it would otherwise
       start the same match under the other one. */
    FB.put(this.path()+"/go",{s:seed,r:NET_RULE,at:Date.now()}).catch(()=>{});
  },

  async poll(){
    if(!this.on) return;
    /* A gap this long is not a slow tick: nothing was read and nothing was
       beaten for as long as the room waits before writing a player off, so it
       already has. Coming back to a match everyone else has finished playing
       is not coming back to it. */
    if(this.lastPoll && now()-this.lastPoll>ROOM_GONE) dropOut();
    this.lastPoll=now();
    try{
      const v=await FB.get(this.path());
      if(!this.on) return;
      if(!v||!v.p){ UI.roomGone(); return; }
      /* Not while a start is in flight. The rule that counts is the one /go
         carried, and the well is built a screen-change later — long enough
         for two more polls to put the room's own rule back over it and build
         the match under the wrong one. */
      if(!this.host && !this.starting) NET_RULE = v.r==="score" ? "score" : "attack";

      const nowMs=Date.now();
      const list=Object.keys(v.p).map(pid=>{
        const r=v.p[pid]||{};
        return {pid, n:String(r.n||"").slice(0,12)||T("opponent"), j:r.j||0, t:r.t||0,
                rdy:!!r.rdy, w:r.w|0, d:!!r.d, b:r.b||null};
      }).filter(p=>p.pid===PID || nowMs-p.t<ROOM_GONE)
        .sort((a,b)=>a.j-b.j||(a.pid<b.pid?-1:1));

      if(!list.some(p=>p.pid===PID)){ UI.roomGone(); return; }   // dropped, or the room was taken down
      const grew=list.length!==this.players.length;
      this.players=list;

      /* Only the host calls a start, and a room whose host went without taking
         it down — a tab killed by the phone, a laptop shut — would be one
         nobody could ever start again. The player who has been here longest
         takes it over, which every client works out the same way. */
      if(!list.some(p=>p.pid===(v.h||""))){
        const heir=list[0];
        if(heir && heir.pid===PID && !this.host){
          this.host=true;
          FB.put(this.path()+"/h",PID).catch(()=>{});
        }
      }else if(this.host && v.h!==PID) this.host=false;

      /* Anyone the round started with who is no longer on the list has left it
         — walked out, or stopped beating long enough to be filtered off. Either
         way the round does not wait for them, and does not take them back. */
      if(this.lastGo)
        for(const pid of this.roster.keys())
          if(!list.some(p=>p.pid===pid)) this.dropped.add(pid);

      // garbage addressed to me: take it, then clear it
      const mineRec=v.p[PID]||{};
      if(mineRec.g){
        for(const k of Object.keys(mineRec.g)){
          const n=mineRec.g[k]|0;
          if(G && !G.over && G.mode==="versus" && n>0) G.queueGarbage(n);
          FB.del(this.mine()+"/g/"+k);
        }
      }

      /* Read as what is there rather than as what is new since a high-water
         mark: the keys are four different wall clocks, and a player whose
         machine ran a minute behind the room would have written every line
         under one already passed and never been heard from again. */
      if(v.c){
        const keys=Object.keys(v.c).sort((a,b)=>parseInt(a,10)-parseInt(b,10));
        this.chat=keys.slice(-CHAT_KEEP).map(k=>({
          n:String((v.c[k]||{}).n||"").slice(0,12), m:String((v.c[k]||{}).m||"").slice(0,120)
        }));
        if(this.host && keys.length>CHAT_KEEP)
          keys.slice(0,keys.length-CHAT_KEEP).forEach(k=>FB.del(this.path()+"/c/"+k));
      }else this.chat=[];

      if(v.go && v.go.at && v.go.at!==this.lastGo){
        this.lastGo=v.go.at;
        this.starting=now();
        /* Whoever is in the room as the start lands is in the round. Taken
           here, before anyone can arrive to watch it. */
        this.roster=new Map(list.map(p=>[p.pid,p.j]));
        this.dropped.clear();
        NET_SEED=v.go.s>>>0;
        NET_RULE=v.go.r==="score"?"score":"attack";
        startMatch();
      }

      mirrorFoes(this.others().filter(p=>this.inRound(p)));
      if(grew||UI.cur==="#v-room") UI.renderRoom();
      if(G && G.mode==="versus" && !G.over) checkLastStanding();
      if(this.host) this.maybeStart();
    }catch(e){ /* one dropped poll is not a lost room */ }
    if(this.on) this.timer=setTimeout(()=>this.poll(),ROOM_MS);
  },

  maybeStart(){
    if(G && !G.over) return;
    /* A start is not a well yet — the room screen has to leave first — so for
       most of a second there is no game to see and the ready flags that called
       it are still on their way down. Without this the host reads them back
       and calls a second start, and a client that had already built its game
       from the first one keeps a seed nobody else is playing. The time is a
       backstop for a call that never landed, not a schedule. */
    if(this.starting && now()-this.starting<8000) return;
    const p=this.players;
    if(p.length<2||!p.every(x=>x.rdy)) return;
    this.callStart();          // each client clears its own ready as it starts
  }
};

/* ---- who else is out there ----------------------------------------------
   Everyone pointed at the same database announces themselves under /who and
   keeps a heartbeat going, so a room can list people to invite rather than
   only codes to type. An invite is written into the invitee's own record —
   the same addressing the garbage uses, and for the same reason.          */
const WHO_HB=4000, WHO_GONE=15000;
const Who = {
  on:false, hb:null, timer:null, room:null, people:[], invite:null,

  start(){
    if(!FB.on()||this.on) return;
    PID=PID||roomId(8);
    this.on=true;
    this.beat();
    this.hb=setInterval(()=>this.beat(),WHO_HB);
    this.poll();
  },
  stop(){
    if(!this.on) return;
    this.on=false;
    clearInterval(this.hb); clearTimeout(this.timer);
    this.hb=this.timer=null; this.people=[]; this.invite=null;
    if(FB.on()) FB.del("/who/"+PID);
  },
  inRoom(id){ this.room=id; this.beat(); },
  beat(){
    if(!this.on||!FB.on()) return;
    // merged, not replaced: an invite lives under this same record
    FB.patch("/who/"+PID,{n:CFG.name, t:Date.now(), r:this.room||0}).catch(()=>{});
  },
  ask(pid){ if(Room.on) FB.put("/who/"+pid+"/inv",{r:Room.id, n:CFG.name, t:Date.now()}).catch(()=>{}); },

  async poll(){
    if(!this.on) return;
    try{
      const v=await FB.get("/who");
      if(!this.on) return;
      const now=Date.now();
      this.people=Object.keys(v||{}).map(pid=>({
        pid, n:String((v[pid]||{}).n||"").slice(0,12), t:(v[pid]||{}).t||0, r:(v[pid]||{}).r||0
      })).filter(p=>p.pid!==PID && now-p.t<WHO_GONE)
        .sort((a,b)=>a.n<b.n?-1:1);

      const inv=(v&&v[PID]||{}).inv;
      if(inv && now-(inv.t||0)<60000 && (!this.invite||this.invite.t!==inv.t)){
        this.invite={r:inv.r, n:String(inv.n||"").slice(0,12), t:inv.t};
        UI.gotInvite(this.invite);
      }
      if(UI.cur==="#v-room") UI.renderInvitables();
      if(UI.cur==="#v-online") UI.renderPeople();
    }catch(e){ /* a dropped poll is not an empty world */ }
    if(this.on) this.timer=setTimeout(()=>this.poll(),WHO_HB);
  },
  clearInvite(){ this.invite=null; if(FB.on()) FB.del("/who/"+PID+"/inv"); }
};

const Net = {
  pc:null, dc:null, role:null, peerName:"", state:"idle",
  stats:{host:0,srflx:0,ice:"new",conn:"new"},
  watchdog:null, room:null, unwatch:null, offerCode:"", mode:"p2p", lastB:"",

  ready(){ return this.mode==="room" ? Room.on : !!(this.dc && this.dc.readyState==="open"); },
  setState(s){ this.state=s; UI.netStatus(); },

  resetStats(){ this.stats={host:0,srflx:0,ice:"new",conn:"new"}; UI.diag(); },

  reset(){
    this.clearWatchdog();
    Room.stop();
    this.dropRoom();
    this.mode="p2p";
    try{ this.dc&&this.dc.close(); }catch(e){}
    try{ this.pc&&this.pc.close(); }catch(e){}
    this.pc=this.dc=null; this.role=null; this.peerName=""; this.lastB="";
    this.resetStats();
    this.setState("idle");
  },

  /* The host owns the room and takes it down with it; a guest only clears the
     branch it was writing. */
  dropRoom(){
    if(this.unwatch){ this.unwatch(); this.unwatch=null; }
    if(this.room && FB.on()){
      const id=this.room, host=this.role==="host";
      const wipe=()=>{ if(host){ FB.del("/lobby/"+id); FB.del("/rooms/"+id); } else FB.del("/rooms/"+id+"/g"); };
      wipe();
      setTimeout(wipe,600);          // catch anything a write in flight recreated
    }
    this.room=null;
  },

  /* soft: the reply travels back by hand, so a long wait is not a failure —
     leave a note and keep waiting instead of calling the match dead. */
  armWatchdog(ms,soft){
    this.clearWatchdog();
    this.watchdog=setTimeout(()=>{
      this.watchdog=null;
      if(this.state==="connected") return;
      if(soft){ UI.stillWaiting(); this.armWatchdog(ms,true); }
      else UI.connectFailed("timeout");
    },ms);
  },
  clearWatchdog(){ if(this.watchdog){ clearTimeout(this.watchdog); this.watchdog=null; } },

  makePC(){
    const pc=new RTCPeerConnection(rtcConfig());
    this.resetStats();

    pc.onicecandidate=e=>{
      const c=e.candidate && e.candidate.candidate;
      if(!c) return;
      const m=/ typ (host|srflx|prflx)/.exec(c);
      if(m && this.stats[m[1]]!==undefined) this.stats[m[1]]++;
      UI.diag();
    };
    pc.onicegatheringstatechange=()=>{ this.stats.ice=pc.iceGatheringState; UI.diag(); };
    pc.oniceconnectionstatechange=()=>{
      this.stats.conn=pc.iceConnectionState; UI.diag();
      if(pc.iceConnectionState==="failed"){
        if(this.state==="connected") UI.peerLost(); else UI.connectFailed("ice");
      }else if(pc.iceConnectionState==="disconnected"||pc.iceConnectionState==="closed"){
        if(this.state==="connected") UI.peerLost();
      }
    };
    pc.onconnectionstatechange=()=>{
      if(pc.connectionState==="failed" && this.state!=="connected") UI.connectFailed("ice");
    };
    this.pc=pc;
    return pc;
  },

  bindChannel(dc){
    this.dc=dc;
    dc.onopen=()=>{
      this.clearWatchdog();
      this.dropRoom();                    // the codes have done their job
      this.setState("connected");
      this.send({t:"hi",name:CFG.name,r:NET_RULE});
      // The match starts on the peer's "hi", not on this open: the two channels
        // can open seconds apart.
    };
    dc.onclose=()=>{ if(this.state==="connected") UI.peerLost(); };
    dc.onmessage=e=>{
      let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
      this.onMsg(m);
    };
  },

  send(obj){
    if(!this.ready()) return;
    /* Boards are the bulk of the traffic: pack the well, and say nothing at all
       when it has not moved since the last frame — the peer already holds it,
       and the key it would be written to is last-value anyway. */
    if(obj.t==="b"){
      obj={t:"b",d:Grid.enc(obj.d),s:obj.s,p:obj.p,o:obj.o};
      const key=JSON.stringify(obj);
      if(key===this.lastB) return;
      this.lastB=key;
    }
    /* In a room every player publishes its own state and reads the rest, so
       there is nothing to send but the board — the room object owns the
       branch, and garbage goes out addressed rather than broadcast. */
    if(this.mode==="room"){ if(obj.t==="b") Room.set("b",obj); return; }
    try{ this.dc.send(JSON.stringify(obj)); }catch(e){}
  },

  onMsg(m){
    switch(m.t){
      case "hi":
        this.peerName=String(m.name||T("opponent")).slice(0,12);
        if(this.role==="guest") NET_RULE = m.r==="score" ? "score" : "attack";
        if(FOES[0]) FOES[0].name=this.peerName;
        else FOES=[{pid:"peer",name:this.peerName,board:null,sent:0,dead:false,wins:0}];
        UI.peerJoined();
        break;
      case "b":
        if(!FOES[0]) FOES=[{pid:"peer",name:this.peerName||T("opponent"),board:null,sent:0,dead:false,wins:0}];
        FOES[0].board=Grid.dec(m.d); FOES[0].sent=m.s|0; FOES[0].score=m.p|0; FOES[0].dead=!!m.o;
        break;
      case "a":
        if(G && !G.over && G.mode==="versus"){
          G.queueGarbage(m.n|0);
        }
        break;
      case "d":
        if(FOES[0]) FOES[0].dead=true;
        // only under the attack rule is the last well standing the winner
        if(G && !G.over && G.attacks) G.win();
        break;
      case "m":
        if(this.role==="guest"){ NET_RULE = m.r==="score" ? "score" : "attack"; UI.renderRoom(); }
        break;
      case "r": UI.peerReady(!!m.v); break;
    }
  },

  /* STEP 1 (host): build the offer code */
  async createOffer(){
    this.reset();
    this.role="host";
    this.setState("offering");
    NET_RULE="attack";
    NET_SEED=((Math.random()*0xffffffff)>>>0)||1;   // a seed of 0 reads as "no seed", and the bag falls back to chance
    const pc=this.makePC();
    this.bindChannel(pc.createDataChannel("tetris",{ordered:true}));
    await pc.setLocalDescription(await pc.createOffer());
    await waitIceGatheringComplete(pc);
    this.offerCode=encodeBlob({k:"o",d:this.pc.localDescription,n:CFG.name,s:NET_SEED});
    return this.offerCode;
  },

  /* STEP 2 (guest): offer code in, answer code out */
  async createAnswer(offerCode){
    let data;
    try{ data=decodeBlob(offerCode); }catch(e){ throw new Error(T("e_badcode")); }
    if(!data || data.k!=="o" || !data.d) throw new Error(T("e_nothost"));

    this.reset();
    this.role="guest";
    this.setState("answering");
    NET_SEED=data.s>>>0;
    this.peerName=String(data.n||T("opponent")).slice(0,12);

    const pc=this.makePC();
    pc.ondatachannel=e=>this.bindChannel(e.channel);
    await pc.setRemoteDescription(data.d);
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIceGatheringComplete(pc);
    this.armWatchdog(60000,true);
    return encodeBlob({k:"a",d:this.pc.localDescription,n:CFG.name});
  },

  /* STEP 3 (host): accept the answer code */
  async acceptAnswer(answerCode){
    let data;
    try{ data=decodeBlob(answerCode); }catch(e){ throw new Error(T("e_badcode")); }
    if(!data || data.k!=="a" || !data.d) throw new Error(T("e_notguest"));
    if(!this.pc) throw new Error(T("e_first"));
    if(data.n) this.peerName=String(data.n).slice(0,12);
    await this.pc.setRemoteDescription(data.d);
    this.setState("linking");
    this.armWatchdog(45000);
  },

  /* ---- rooms, for the relayed match ---------------------------------- */
  async listRooms(){
    if(!FB.on()) throw new Error(T("e_nofb"));
    const idx=await FB.get("/lobby");
    const out=[];
    const now=Date.now();
    for(const id in (idx||{})){
      const r=idx[id]||{};
      if(now-(r.t||0)>ROOM_STALE) { FB.del("/lobby/"+id); FB.del("/rooms/"+id); continue; }
      out.push({id, name:String(r.n||"").slice(0,12), count:r.c|0});
    }
    return out;
  },

  async openRoom(){
    this.reset();
    this.role="host"; this.mode="room";
    const id=await Room.create();
    this.room=id;
    this.setState("connected");
    return id;
  },

  async joinRoom(id){
    this.reset();
    this.role="guest"; this.mode="room";
    await Room.join(id);
    this.room=id;
    this.setState("connected");
  }
};

/* 8 · UI */
/* Where BACK goes from each screen — the menus are a plain tree. */
const PARENT = {
  "#v-play":       "#v-menu",
  "#v-set":        "#v-menu",
  "#v-records":    "#v-play",
  "#v-speed":      "#v-play",
  "#v-lobby":      "#v-play",
  "#v-server":     "#v-lobby",
  "#v-p2p":        "#v-lobby",
  "#v-online":     "#v-server",
  "#v-host":       "#v-p2p",
  "#v-join":       "#v-p2p",
  "#v-room":       "#v-lobby"
};

/* Leaving one of these drops whatever handshake it was holding. */
const NET_SCREENS = {"#v-online":1,"#v-host":1,"#v-join":1};

const UI = {
  stack:[], rev:false,
  cur:"#v-menu",

  /* One screen at a time. A move out and a move in cannot overlap — a card
     fading up through one still leaving is unreadable — so the arrival waits
     for the exit to finish. */
  show(id,inner){
    const from=this.cur;
    if(id && from && id!==from){
      const rev=this.rev;              // the exit consumes it; the arrival needs it too
      this.board(id);                  // start the board's fade with the move, not after it
      this.show(null,true);            // the exit half must not undo that
      const seq=++SHOW_SEQ;
      afterScreen(()=>{ if(seq===SHOW_SEQ){ this.rev=rev; this.show(id,false); } });
      return;
    }
    SHOW_SEQ++;
    if(!inner) this.board(id);
    const rev=this.rev; this.rev=false;
    $$(".veil").forEach(v=>{
      if(v.classList.contains("on")) v.classList.add("out");
      v.classList.remove("on","fwd");
    });
    if(id){
      const el=$(id);
      el.classList.remove("out");
      if(!rev){
        // park it to the right, and make the browser take that as the starting
        // point — reading the card's own style is what forces the flush
        el.classList.add("fwd");
        const c=el.querySelector(".card");
        if(c) this._flush=getComputedStyle(c).transform;
      }
      el.classList.add("on");
      this.cur=id;
    }
    else this.cur=null;
    document.body.classList.toggle("playing",!!G && !this.cur);
  },
  /* The board belongs to the run: up while one exists and nothing but the pause
     or result card is over it, gone the moment we head for a menu. */
  board(id){
    $("#screen").classList.toggle("live", !!G && (!id || id==="#v-pause" || id==="#v-over"));
  },
  closeAll(){ this.show(null); },
  /* Back leaves the screen the button is on, which the button names itself —
     the current screen is the same thing in every case we have now. */
  back(from){
    this.rev=true;                       // leave to the left, not downwards
    const src=from||this.cur;
    const to=PARENT[src]||"#v-menu";
    if(NET_SCREENS[src]){ clearInterval(this._rooms); Net.reset(); }
    this.show(to);
  },

  /* lobby */
  diag(){
    const st=Net.stats;
    const el=Net.role==="guest"?$("#j-diag"):$("#h-diag");
    if(!el||Net.mode==="relay") return;
    const parts=[
      T("d_local")+" "+st.host,
      T("d_public")+" "+st.srflx,
      T("d_link")+" "+st.conn.toUpperCase()
    ];
    el.textContent=parts.join(" · ");
  },

  /* A plain note in the hint line, not the red flash. */
  stillWaiting(){
    const el=$(Net.role==="guest"?"#j-hint":"#h-hint");
    if(!el) return;
    if(el.dataset.orig===undefined) el.dataset.orig=el.innerHTML;
    el.textContent=T("e_waiting");
    this.diag();
  },

  connectFailed(why){
    Net.clearWatchdog();
    const st=Net.stats;
    let msg;
    if(why==="relay")     msg=T("e_relay");
    else if(st.srflx===0)  msg=T("e_nostun");
    else if(why==="ice")  msg=T("e_direct");
    else                  msg=T("e_generic");
    if(why==="timeout") msg=T("e_timeout")+" "+msg;
    this.err(Net.role==="guest"?"#j-hint":"#h-hint",msg,true);
    Net.setState("failed");
    this.diag();
  },

  netStatus(){
    const label=Net.mode==="relay"&&Net.state==="connected" ? T("st_relayed") : T({
      idle:"st_idle", offering:"st_offering", answering:"st_answering",
      linking:"st_linking", connected:"st_connected", failed:"st_failed"
    }[Net.state]||"st_idle");
    const hs=$("#hs"), js=$("#js");
    const cls=Net.state==="connected"?"":Net.state==="failed"?"bad":"wait";
    if(hs){ if(Net.role==="host"){ hs.textContent=label; hs.className=cls; }
            else if(Net.state==="idle"){ hs.textContent=T("st_preparing"); } }
    if(js){ if(Net.role==="guest"){ js.textContent=label; js.className=cls; }
            else if(Net.state==="idle"){ js.textContent=T("st_waiting"); } }
  },

  async doHost(){
    Sfx.ui();
    this.show("#v-host");
    $("#h-out").value=""; $("#h-in").value="";
    $("#hs").textContent=T("st_preparing"); $("#hs").className="wait";
    try{
      await Net.createOffer();
    }catch(e){
      this.err("#h-hint",T("e_make",{m:e.message}),true);
    }
    $("#h-out").value=Net.offerCode||"";
    this.netStatus();
  },

  /* the online lobby: a list of open rooms, refreshed while it is on screen */
  async doOnline(){
    Sfx.ui();
    Net.reset();
    Who.start();
    this.show("#v-online");
    $("#on-wait").hidden=true;
    $("#on-list").innerHTML="";
    this.refreshRooms();
    clearInterval(this._rooms);
    this._rooms=setInterval(()=>{ if(this.cur==="#v-online" && Net.state==="idle") this.refreshRooms(); },3000);
  },

  async refreshRooms(){
    const list=$("#on-list");
    if(!list) return;
    try{
      const rooms=await Net.listRooms();
      if(!rooms.length){ list.innerHTML='<p class="diag" id="on-none"></p>'; $("#on-none").textContent=T("on_none"); return; }
      list.innerHTML=rooms.map(r=>
        '<button class="mi nav room" data-room="'+esc(r.id)+'"><span>'+esc(r.name||T("opponent"))+
        '</span><span class="sub">'+esc(T("on_seats",{n:r.count||1,max:MAX_SEATS}))+'</span></button>').join("");
      list.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>this.doJoinRoom(b.dataset.room));
    }catch(e){ this.err("#on-hint",e.message,true); }
  },

  /* A room is somewhere to be rather than something to wait in, so opening
     one puts you straight into it and the others arrive around you. */
  async doMakeRoom(){
    Sfx.ui();
    Net.reset();
    clearInterval(this._rooms);
    try{ await Net.openRoom(); Who.start(); this.showRoom(); }
    catch(e){ this.show("#v-server"); this.err("#srv-hint",e.message,true); }
  },

  async doJoinRoom(id){
    Sfx.ui();
    $("#on-wait").hidden=false;
    $("#on-s").textContent=T("st_linking");
    try{ await Net.joinRoom(id); Who.start(); this.showRoom(); }
    catch(e){
      $("#on-wait").hidden=true;
      this.err("#on-hint",e.message,true);
      Net.reset();
      this.refreshRooms();
    }
  },

  showRecords(){
    this.renderRecords();
    this.show("#v-records");
  },
  renderRecords(){
    const el=$("#rec-list");
    if(!el) return;
    const dash=T("rec_empty");
    const rows=[
      [T("rec_marathon"), REC.marathon>0 ? REC.marathon.toLocaleString() : dash],
      [T("rec_sprint"),   REC.sprint>0   ? REC.sprint.toFixed(2)+"s"     : dash],
      [T("rec_wins"),     REC.wins>0     ? String(REC.wins)              : dash],
      ...["easy","normal","hard"].map(d=>
        [T("rec_speed",{d:T("sp_"+d)}), REC.speed[d]>0 ? String(REC.speed[d]) : dash])
    ];
    el.innerHTML=rows.map(([k,v])=>
      '<div class="rec'+(v===dash?" none":"")+'"><span class="k">'+esc(k)+
      '</span><span class="v">'+esc(v)+'</span></div>').join("");
  },

  /* Settings is one screen with five panels. Opening it returns to the tab you
     were last on, which is what you want when you are trying a setting out and
     coming back to it. */
  openSettings(){
    this.show("#v-set");
    this.openTab(TAB);
  },
  openTab(name){
    TAB=name;
    $$(".tab").forEach(b=>{
      const on=b.dataset.tab===name;
      b.classList.toggle("on",on);
      b.setAttribute("aria-selected",on?"true":"false");
    });
    $$(".panel").forEach(p=>p.classList.toggle("on",p.dataset.panel===name));
    /* On a display too narrow for the whole strip, the tab you just chose has
       to be the one you can see. Scrolled by hand rather than with
       scrollIntoView, which would take the page with it. */
    const strip=$("#tabstrip"), live=$$(".tab").find(b=>b.dataset.tab===name);
    if(live && strip.scrollWidth>strip.clientWidth){
      const l=live.offsetLeft, r=l+live.offsetWidth;
      if(l<strip.scrollLeft) strip.scrollLeft=l-14;
      else if(r>strip.scrollLeft+strip.clientWidth) strip.scrollLeft=r-strip.clientWidth+14;
    }
    /* A panel is built when it comes up rather than at boot: the bind lists and
       the preview are the expensive ones, and both go stale on their own. */
    if(name==="controls"){
      repaintSettings();
      paintTouch();
      bindRows("#keylist","keys");
      bindRows("#padlist","pads");
      paintPad();
      requestAnimationFrame(renderPreview);
    }
    if(name==="video") paintTheme();
    if(name==="audio") repaintSettings();
  },

  doJoinScreen(){
    Sfx.ui();
    Net.reset();
    this.show("#v-join");
    $("#j-in").value=""; $("#j-out").value="";
    $("#js").textContent=T("st_waiting"); $("#js").className="wait";
  },

  async doAnswer(){
    Sfx.ui();
    const input=$("#j-in").value.trim();
    if(!input){ this.err("#j-hint",T("e_pastehost")); return; }
    $("#j-out").value=T("working");
    try{
      $("#j-out").value=await Net.createAnswer(input);
      this.ok("#j-hint",T("ok_sendback"));
    }catch(e){
      $("#j-out").value="";
      this.err("#j-hint",e.message);
    }
    this.netStatus();
  },

  async doAccept(){
    Sfx.ui();
    const input=$("#h-in").value.trim();
    if(!input){ this.err("#h-hint",T("e_pastereply")); return; }
    try{
      await Net.acceptAnswer(input);
      this.ok("#h-hint",T("ok_linking"));
    }catch(e){ this.err("#h-hint",e.message); }
    this.netStatus();
  },

  async copy(sel,hintSel){
    const t=$(sel);
    if(!t.value){ return; }
    let ok=false;
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(t.value);
        ok=true;
      }
    }catch(e){}
    if(!ok){
      // No clipboard API on file://, and iOS will not select a readonly field.
      try{
        const tmp=document.createElement("textarea");
        tmp.value=t.value;
        tmp.setAttribute("readonly","");
        tmp.style.cssText="position:fixed;top:0;left:0;opacity:0;font-size:16px";
        document.body.appendChild(tmp);
        tmp.contentEditable="true";
        tmp.focus();
        tmp.setSelectionRange(0,t.value.length);
        ok=document.execCommand("copy");
        document.body.removeChild(tmp);
      }catch(e){ ok=false; }
    }
    Sfx.ui();
    if(hintSel){
      if(ok) this.ok(hintSel,T("copied"));
      else { this.err(hintSel,T("copyfail")); t.focus(); t.setSelectionRange(0,t.value.length); }
    }
  },

  /* room — connecting drops both players here */
  peerJoined(){
    if(G && G.mode==="versus" && !G.over) return;
    Sfx.win();
    this.showRoom();
  },
  showRoom(){ this.renderRoom(); this.show("#v-room"); },

  /* The room draws itself from what the poll last reported, so there is one
     account of who is in it rather than a local copy drifting from it. */
  renderRoom(){
    const host=$("#seatlist");
    if(!host) return;
    const inRoom=Room.on;
    const me=inRoom?Room.me():null;
    const players=inRoom?Room.players
      :(Net.ready()?[{pid:PID,n:CFG.name,rdy:READY_P2P.me,w:WINS_P2P.me,d:false},
                     {pid:"peer",n:Net.peerName||T("opponent"),rdy:READY_P2P.peer,w:WINS_P2P.peer,d:false}]:[]);

    const title=$("#room-title");
    if(title) title.textContent = players.length
      ? T("room_of",{n:(players[0]||{}).n||CFG.name}) : T("room_t");
    // the code is the only way in for someone who cannot see the room list
    const code=$("#room-code");
    if(code) code.textContent = Room.on ? T("room_code",{c:Room.id}) : T("net_tag");

    host.innerHTML=players.map(p=>{
      const you=p.pid===PID;
      return '<div class="seat'+(p.rdy?" ready":"")+'">'+
        '<span class="nm">'+esc(p.n)+'</span>'+
        '<span class="who">'+(you?esc(T("room_you")):"&nbsp;")+'</span>'+
        '<b class="w">'+(p.w|0)+'</b>'+
        '<span class="cap">'+esc(T("room_wins"))+'</span>'+
        '<span class="st">'+esc(T(p.rdy?"room_ready":"room_notready"))+'</span></div>';
    }).join("")||('<p class="none">'+esc(T("room_empty"))+'</p>');

    const btn=$("#b-ready");
    const mine=inRoom?!!(me&&me.rdy):READY_P2P.me;
    btn.textContent=T(mine?"room_unready":"room_ready");
    btn.classList.toggle("on",mine);
    btn.disabled=players.length<2;

    const hint=$("#room-hint");
    if(hint && hint.dataset.orig===undefined)
      hint.textContent = players.length<2 ? T("room_alone")
                       : T("room_hint_n",{n:players.length});

    this.paintRule();
    this.renderInvitables();
    this.renderChat();
  },

  /* Whoever opened the room owns the match — a hand-swapped code has a host
     too, the end that made the offer. Everyone else reads the pick rather
     than makes it, so the two ends cannot start on different rules. */
  isHost(){ return Room.on ? Room.host : Net.role==="host"; },
  setRule(r){
    if(!this.isHost() || NET_RULE===r) return;
    NET_RULE=r;
    if(Room.on) Room.pushRule(); else Net.send({t:"m",r});
    this.renderRoom();
  },
  paintRule(){
    const host=this.isHost(), live=!!(G && G.mode==="versus" && !G.over);
    $$(".rule").forEach(b=>{
      b.classList.toggle("on",b.dataset.rule===NET_RULE);
      b.disabled = !host || live;      // not mid-match: the wells are already running
    });
    const h=$("#rule-hint");
    if(h) h.textContent = T(NET_RULE==="score"?"rule_score_s":"rule_attack_s") +
                          (host?"":" "+T("rule_locked"));
  },

  /* Everyone on the same database who is not already in a room. */
  /* Rebuilt from a signature rather than every poll: the room ticks five
     times a second, and redrawing a list that often loses the press you just
     made and any text you were selecting. */
  renderInvitables(){
    const el=$("#invitelist");
    if(!el||UI.cur!=="#v-room") return;
    if(!Room.on){ el.innerHTML='<p class="none">'+esc(T("room_invite_p2p"))+'</p>'; return; }
    const full=Room.players.length>=MAX_SEATS;
    const free=Who.people.filter(p=>!p.r);
    const sig=free.map(p=>p.pid+(ASKED.has(p.pid)?"!":"")).join(",")+"|"+full+"|"+CFG.lang;
    if(sig===this._invSig) return;
    this._invSig=sig;
    el.innerHTML = free.length
      ? free.map(p=>{
          const asked=ASKED.has(p.pid);
          return '<div class="who2"><span>'+esc(p.n)+'</span>'+
            '<button type="button" data-inv="'+esc(p.pid)+'"'+(full||asked?" disabled":"")+'>'+
            esc(T(asked?"room_asked":full?"room_full":"room_ask"))+'</button></div>';
        }).join("")
      : '<p class="none">'+esc(T("room_nobody"))+'</p>';
  },

  /* The lobby's other half: people, rather than rooms. */
  renderPeople(){
    const el=$("#who-list");
    if(!el) return;
    const free=Who.people;
    el.innerHTML = free.length
      ? free.map(p=>'<div class="who2"><span>'+esc(p.n)+'</span><span class="cap">'+
          esc(T(p.r?"who_busy":"who_free"))+'</span></div>').join("")
      : '<p class="none">'+esc(T("room_nobody"))+'</p>';
  },

  renderChat(){
    const el=$("#chatlog");
    if(!el) return;
    const log=Room.on?Room.chat:[];
    const sig=log.length+"|"+(log[log.length-1]||{}).m+"|"+CFG.lang;
